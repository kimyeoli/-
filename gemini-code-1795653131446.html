<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAJA SURVIVORS — v1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 상단 HUD -->
  <header id="hud" class="hidden">
    <div class="hud-left">
      <div class="badge ver-badge" id="ver-badge">v1</div>
      <div class="stat-box">
        <span class="label">LV</span>
        <strong id="hud-lv">1</strong>
      </div>
      <div class="bar-wrap hp-wrap">
        <div class="bar-fill hp-fill" id="hud-hp-bar"></div>
        <span class="bar-text" id="hud-hp-text">100 / 100</span>
      </div>
    </div>

    <div class="hud-center">
      <div class="timer-box" id="hud-time">00:00</div>
      <div class="sub-stats">
        <span>처치 <strong id="hud-kills">0</strong></span>
        <span>콤보 <strong id="hud-combo">0</strong></span>
      </div>
    </div>

    <div class="hud-right">
      <button id="btn-aim-toggle" class="cartoon-btn sm" type="button" title="Tab 키로 전환">
        조준: <span id="aim-mode-label">자동</span> [Tab]
      </button>
      <button id="btn-sound-toggle" class="cartoon-btn sm" type="button">🔊</button>
    </div>

    <!-- 경험치 바 -->
    <div class="xp-bar-track">
      <div class="xp-bar-fill" id="hud-xp-bar"></div>
    </div>
  </header>

  <!-- 무정지 레벨업 선택 카드 (1, 2, 3) -->
  <section id="levelup-dock" class="hidden" aria-label="레벨업 업그레이드">
    <div class="dock-title">LEVEL UP! <span>[1 / 2 / 3] 또는 클릭</span></div>
    <div id="levelup-cards" class="cards-row"></div>
  </section>

  <!-- 하단 타자 공격 입력창 -->
  <section id="typing-dock" class="hidden">
    <div class="word-display" id="word-display"></div>
    <div class="input-row">
      <input
        id="typing-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="단어 입력 후 Space 또는 Enter"
      />
      <span class="hint-key">Space / Enter 발사</span>
    </div>
  </section>

  <!-- 시작 / 게임오버 오버레이 -->
  <div id="overlay" class="overlay">
    <div class="modal-card" id="start-panel">
      <div class="badge ver-badge">v1 · SINGLE PROTOTYPE</div>
      <h1 class="game-title">TAJA<br/>SURVIVORS</h1>
      <ul class="guide-list">
        <li><strong>이동:</strong> 모눈종이 타일 클릭 (자동 이동)</li>
        <li><strong>공격:</strong> 제시어 입력 후 <code>Space</code> 또는 <code>Enter</code></li>
        <li><strong>조준:</strong> <code>Tab</code> 키로 [자동 조준 ↔ 마우스 방향] 전환</li>
        <li><strong>성장:</strong> 레벨업 시 <code>1 · 2 · 3</code> 키로 즉시 업그레이드</li>
      </ul>
      <button id="btn-start" class="cartoon-btn primary lg" type="button">게임 시작</button>
    </div>

    <div class="modal-card hidden" id="gameover-panel">
      <div class="badge danger">GAME OVER</div>
      <h2 class="over-title">생존 종료</h2>
      <div class="result-grid">
        <div><span>생존 시간</span><strong id="res-time">00:00</strong></div>
        <div><span>도달 레벨</span><strong id="res-lv">1</strong></div>
        <div><span>처치 수</span><strong id="res-kills">0</strong></div>
        <div><span>입력 단어</span><strong id="res-words">0</strong></div>
      </div>
      <button id="btn-retry" class="cartoon-btn primary lg" type="button">다시 도전</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
