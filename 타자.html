<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taja.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1f8fc;--grid:#d5e6f1;--ink:#17233a;--mute:#5d6b7e;--line:#c6d8e4;--acc:#2f6fae;--accd:#1f4f82;--hl:#ffd84d;--ok:#12935f;--bad:#e5484d}
*{box-sizing:border-box;margin:0}
body{font:500 16px/1.55 'Noto Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);min-height:100vh;
background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/30px 30px,var(--paper)}
h1,h2,h3,.brand,.logo,.av,.big,.stat b,.hud b,.rk,.sc{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:24px;max-width:960px;margin:0 auto;padding:18px 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;color:var(--ink);text-decoration:none}
.logo{width:34px;height:34px;border-radius:99px;background:linear-gradient(145deg,#bfe6ff,#2f6fae 70%);color:#fff;border:2px solid #fff;text-shadow:0 1px 2px #1f4f8266;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 var(--accd)}
nav{display:flex;gap:4px;margin-right:auto}
nav a{padding:8px 16px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:700}
nav a.on{background:var(--ink);color:#fff}
.chip{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:4px 16px 4px 4px}
main{max-width:960px;margin:0 auto;padding:8px 20px 60px}
main>section,main>p{margin-top:14px}
.av{display:block;border-radius:50%;width:32px;height:32px;flex:none;overflow:hidden;border:1.5px solid var(--ink)}
.av svg{display:block;width:100%;height:100%}
.rig-svg .rig{transform-origin:50px 84px;animation:av-breathe 3.2s ease-in-out infinite}
.rig-svg .eyes{transform-origin:50px 56px;animation:av-blink 4.8s infinite}
.rig-svg .pupils{animation:av-glance 7s ease-in-out infinite}
.rig-svg .arm-l{transform-origin:20px 70px;animation:av-arm-l 3.2s ease-in-out infinite}
.rig-svg .arm-r{transform-origin:80px 70px;animation:av-arm-r 3.2s ease-in-out infinite}
.rig-svg .sway{animation:av-sway 2.8s ease-in-out infinite}
.rig-svg .flutter{animation:av-flutter 1.9s ease-in-out infinite}
.rig-svg .twinkle{animation:av-twinkle 2.4s ease-in-out infinite}
.rig-svg .pulse{animation:av-pulse 2.2s ease-in-out infinite}
@keyframes av-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.975)}}
@keyframes av-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes av-glance{0%,56%,100%{transform:translateX(0)}62%,72%{transform:translateX(-1.4px)}80%,90%{transform:translateX(1.4px)}96%{transform:translateX(0)}}
@keyframes av-arm-l{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes av-arm-r{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
@keyframes av-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes av-flutter{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.86)}}
@keyframes av-twinkle{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes av-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.rig-svg *{animation:none!important}}
.rig-svg.off *,body.bg .rig-svg *{animation-play-state:paused!important}
/* small avatars (lists, shop tiles, chat, rank) do not animate: the motion is too small to see and each one costs memory */
.av.xs .rig-svg *,.av.m .rig-svg *,.av.s .rig-svg *{animation:none!important}
.av.xs{width:28px;height:28px}.av.m{width:64px;height:64px}.av.l{width:96px;height:96px}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:22px}
.card h3{font-size:20px;margin-bottom:10px}
.btn{font:inherit;font-weight:700;display:inline-block;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:10px 20px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--ink)}
.btn:focus-visible,nav a:focus-visible,.seg button:focus-visible,.sw button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.mute{color:var(--mute)}.small{font-size:14px}
.tag,.pb{display:inline-block;background:var(--hl);font-weight:700;font-size:14px;padding:2px 12px;border-radius:999px}
.greet h2{font-size:34px;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat span{color:var(--mute);font-size:14px;font-weight:700;display:block}
.stat b{font-size:34px;line-height:1.3}.stat small{font:700 14px 'Noto Sans KR';color:var(--mute);margin-left:4px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:26px}
.mode h3{font-size:28px;margin:0}.mode p{flex:1;margin-bottom:10px}
.mode.w{background:var(--hl)}.mode.s{background:var(--acc);color:#fff}
.seg{display:inline-flex;background:#e3ebe5;border-radius:12px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:700;border:0;background:0;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.rhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.rhead h2{font-size:34px}
.rank{padding:8px}
table{width:100%;border-collapse:collapse}
th{color:var(--mute);font-size:14px;text-align:right;padding:12px 14px}
td{padding:12px 14px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:center;width:64px}th:nth-child(2),td:nth-child(2){text-align:left}
.who{display:flex;gap:10px;align-items:center;font-weight:700}
.rk{font-size:22px}.r1{color:#d49b00}.r2{color:#7b8794}.r3{color:#b36a2e}.sc{font-size:20px}
tr.me td{background:#fff8d6}
.empty{padding:36px;text-align:center;color:var(--mute)}
.game{padding:26px}
.bar{height:10px;background:#e3ebe5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--acc);border-radius:99px;transition:width .1s linear}
.hud{display:flex;gap:30px;margin:16px 0 4px}
.hud div{display:flex;align-items:baseline;gap:4px}.hud b{font-size:38px;min-width:2ch}.hud span{color:var(--mute);font-weight:700;font-size:14px}
.target{font:700 clamp(30px,5.2vw,50px)/1.4 'Noto Sans KR',sans-serif;min-height:2.9em;padding:20px 4px 8px;white-space:pre-wrap;word-break:keep-all;color:#8793a3}
.target span{border-radius:6px}.target .ok{color:var(--ink)}.target .bad{color:var(--bad);background:#fde7e7}.target .cur{background:var(--hl);color:var(--ink)}
.target.no{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nx{color:var(--mute);margin-bottom:12px}.nx b{color:var(--ink)}
#in{width:100%;font:700 26px 'Noto Sans KR',sans-serif;padding:14px 18px;border:2px solid var(--ink);border-radius:12px;background:#fff;outline:0}
#in:focus,label input:focus{border-color:var(--acc);box-shadow:0 0 0 4px #2748c726}
.hint{margin-top:10px}
.res{text-align:center;padding:36px 22px}
.big{font-size:clamp(84px,16vw,140px);line-height:1.05;color:var(--acc);margin:4px 0 10px}
.res .stats{max-width:700px;margin:22px auto;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.prof{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.pl{display:flex;gap:18px;align-items:center}.pl h2{font-size:32px;line-height:1.3}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 2.5px var(--ink)}
.cc{flex-direction:row;align-items:center;gap:8px}
.cc input{width:40px;height:32px;padding:0;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer}
.card h3:not(:first-child){margin-top:24px}
.pts{text-align:right}.pts span{display:block;color:var(--mute);font-size:14px;font-weight:700}
.pts b{font:400 44px/1.2 'Black Han Sans',sans-serif;color:var(--acc)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:16px}
.tile{font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.tile:hover{border-color:var(--ink)}
.tile.on{border-color:var(--ink);background:#fff8d6;box-shadow:0 0 0 1.5px var(--ink)}
.tile.no{opacity:.55}
.tile b{font-size:14px}.tile small{color:var(--mute);font-weight:700;font-size:13px}
.tile:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.spark{width:100%;max-width:520px;height:90px;margin-top:8px}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,#ffffff 0,transparent 45%),linear-gradient(170deg,#1d3a60 0%,#3f6e9e 60%,#9cc7e4 100%);color:#fff;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.hero>*{position:relative;z-index:1}
.hero:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(3px 3px at 15% 20%,#fff 60%,transparent),radial-gradient(2px 2px at 60% 45%,#fff 60%,transparent),radial-gradient(2.5px 2.5px at 85% 80%,#fff 60%,transparent),radial-gradient(2px 2px at 35% 90%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 72% 12%,#fff 60%,transparent);background-size:260px 240px;opacity:.85;animation:snowDrift 12s linear infinite}
.hero .brand{color:#fff}.hero .logo{background:#fff;color:#1f4f82;border-color:#bfe6ff;box-shadow:0 3px 0 #8fb7d6}
.hero h1{font-size:clamp(44px,5.4vw,68px);line-height:1.15;margin-bottom:16px}
.hero p{max-width:30ch;font-size:18px;opacity:.92}
.kr{display:flex;gap:6px;margin-bottom:6px}
.kr i{font-style:normal;width:40px;height:40px;border-radius:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);box-shadow:0 3px 0 rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;animation:press 3.3s var(--d) infinite}
@keyframes press{0%,86%,100%{transform:none}91%{transform:translateY(3px);box-shadow:0 0 0 transparent;background:var(--hl);color:var(--ink)}}
.panel{display:flex;flex-direction:column;justify-content:center;gap:22px;width:100%;max-width:520px;margin:auto;padding:44px clamp(24px,6vw,64px)}
#af{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
label input{font:500 17px 'Noto Sans KR',sans-serif;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;outline:0}
.err{color:var(--bad);font-weight:700;min-height:1.4em;font-size:14px}.note{color:var(--mute);font-size:13px}
.wide{width:100%;padding:14px}
@media(max-width:820px){.auth{grid-template-columns:1fr}.hero{padding:28px 24px;gap:14px}.keys{display:none}.top{flex-wrap:wrap;gap:10px}nav{order:3;width:100%}td,th{padding:10px 6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mode.m{background:var(--ink);color:#fff}
.mode.tdm{background:#ffe9a8}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.rctl{display:flex;gap:10px;flex-wrap:wrap}
.seg.wrap{flex-wrap:wrap}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.btn.lang{font:400 24px 'Black Han Sans',sans-serif;min-width:88px}
.row.l{justify-content:flex-start}
.sky{position:relative;height:clamp(260px,calc(100vh - 340px),560px);overflow:hidden;border-radius:14px;border:1.5px solid var(--ink);background:radial-gradient(circle at 20% 20%,#3b4f93 0,transparent 40%),linear-gradient(#17233a,#25346a);margin-bottom:14px}
.sky.hurt{animation:hurt .3s}
@keyframes hurt{30%{box-shadow:inset 0 0 0 6px #e5484d}}
.met{position:absolute;left:0;top:0;padding:6px 14px;border-radius:999px;background:var(--hl);color:var(--ink);font:700 20px 'Noto Sans KR',sans-serif;white-space:nowrap;box-shadow:0 0 0 4px #ff8a3d55;will-change:transform}
.met i{font-style:normal;color:var(--ok)}
.met.cur{background:#fff}
.met.boss{background:var(--bad);color:#fff;font-size:21px;padding:10px 20px;box-shadow:0 0 0 5px #e5484d55}
.met.boss i{color:var(--hl)}
.met em{font-style:normal;margin-left:8px;background:var(--ink);color:#fff;border-radius:999px;padding:0 8px;font-size:15px}
.met.boom{opacity:0;filter:brightness(2);transition:opacity .2s,filter .2s}
.zap{position:absolute;height:4px;border-radius:2px;background:var(--hl);box-shadow:0 0 10px var(--hl);transform-origin:0 50%;pointer-events:none}
.base{position:absolute;left:50%;bottom:8px;transform:translateX(-50%)}
.base .av{width:72px;height:72px}
.banner{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(32px,6vw,56px) 'Black Han Sans',sans-serif;color:#fff;opacity:0;pointer-events:none}
.banner.show{animation:bn 1.6s}
@keyframes bn{0%{opacity:0;transform:scale(.8)}20%,70%{opacity:1;transform:none}100%{opacity:0}}

/* ===== 운석 모드: 전체 화면 방어전 ===== */
body.meteor-mode{overflow:hidden;background:#050916;color:#eef3ff}
body.meteor-mode .top{display:none}
body.meteor-mode main{max-width:none;padding:0;margin:0}
body.meteor-mode main>section{margin:0}
body.meteor-mode .game{position:fixed;inset:0;z-index:20;padding:0;border:0;border-radius:0;background:transparent;pointer-events:none}
body.meteor-mode .game>*{pointer-events:auto}
body.meteor-mode .hud{position:absolute;z-index:8;top:14px;left:18px;right:18px;justify-content:flex-start;gap:clamp(12px,3vw,34px);margin:0;padding:10px 16px;border:1px solid #7184b866;border-radius:14px;background:#0a1226b8;backdrop-filter:blur(8px);color:#fff}
body.meteor-mode .hud span{color:#b8c7e8} body.meteor-mode .hud b{font-size:clamp(23px,4vw,34px);min-width:1ch}
body.meteor-mode .sky{position:absolute;inset:0;height:100%;margin:0;border:0;border-radius:0;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,#e9f3fb 0,transparent 46%),radial-gradient(circle at 80% 14%,#dbeaff55 0,transparent 30%),linear-gradient(180deg,#1d3358 0%,#3d6396 55%,#8fb6dc 100%)}
body.meteor-mode .sky:before{content:"";position:absolute;inset:0;background-image:radial-gradient(2.5px 2.5px at 12% 18%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 32% 9%,#fff 60%,transparent),radial-gradient(3px 3px at 73% 21%,#f4faff 60%,transparent),radial-gradient(1.5px 1.5px at 88% 13%,#fff 60%,transparent),radial-gradient(2px 2px at 56% 33%,#fff 60%,transparent),radial-gradient(2.5px 2.5px at 42% 25%,#fff 60%,transparent);background-size:310px 210px;opacity:.9;animation:snowDrift 11s linear infinite}
@keyframes snowfall{from{background-position:0 0}to{background-position:0 420px}}
@keyframes snowDrift{0%{background-position:0 0}50%{background-position:-22px 210px}100%{background-position:-8px 420px}}
@keyframes snowDriftFast{0%{background-position:0 0}100%{background-position:-30px 330px}}
body.meteor-mode .sky:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,transparent,#e4f0fa 30%,#c3d9ec 100%);border-top:2px solid #ffffffcc;border-radius:50% 50% 0 0/14px 14px 0 0}
body.meteor-mode .met{z-index:3;isolation:isolate;position:absolute;display:grid;place-items:center;width:104px;height:72px;min-width:0;min-height:0;padding:5px;background:transparent;border:0;border-radius:0;color:#fff1d5;font-size:clamp(13px,1.5vw,17px);line-height:1.2;font-weight:800;text-align:center;overflow:visible;text-shadow:0 2px 4px #24150f,0 0 9px #24150f;filter:drop-shadow(0 5px 5px #0009)}
@keyframes meteorSlowSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
body.meteor-mode .met:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 28% 22%,#e7c49a 0 5%,transparent 17%),radial-gradient(ellipse at 69% 65%,#493b36 0 7%,transparent 19%),radial-gradient(ellipse at 48% 43%,#b58b68 0 8%,transparent 22%),radial-gradient(ellipse at 75% 25%,#d6b18a 0 4%,transparent 15%),linear-gradient(145deg,#92745e 0%,#59483e 38%,#302b2b 72%,#171d29 100%);clip-path:polygon(17% 4%,39% 0,54% 8%,76% 3%,96% 24%,91% 49%,100% 68%,78% 93%,55% 88%,34% 100%,9% 81%,0 55%,8% 29%);border:0;box-shadow:inset -12px -10px 15px #080d19, inset 5px 4px 9px #f0c99a66;animation:meteorSlowSpin 11s linear infinite;transform-origin:50% 50%}
body.meteor-mode .met:after{content:"";position:absolute;z-index:-1;inset:-8px 4px 50%;background:linear-gradient(110deg,transparent 15%,#ffcf8b88 48%,transparent 75%);filter:blur(7px);transform:rotate(-18deg)}
body.meteor-mode .met.boss{width:132px;height:86px;min-width:0;min-height:0;padding:8px;color:#fff4f4;font-size:clamp(15px,1.8vw,20px);text-shadow:0 2px 5px #3a0718,0 0 12px #ff536f}
body.meteor-mode .met.boss:before{background:radial-gradient(ellipse at 27% 25%,#ffb0a0 0 5%,transparent 17%),radial-gradient(ellipse at 68% 65%,#3c172c 0 8%,transparent 20%),radial-gradient(ellipse at 50% 42%,#e15d69 0 8%,transparent 23%),radial-gradient(ellipse at 78% 26%,#ff9a87 0 5%,transparent 15%),linear-gradient(145deg,#c44b59 0%,#7d263f 43%,#421a36 76%,#201b31 100%);border:0;box-shadow:inset -13px -11px 17px #220c25, inset 5px 4px 10px #ffd1b066;animation:meteorSlowSpin 13s linear infinite;clip-path:polygon(16% 3%,37% 0,53% 9%,77% 2%,97% 22%,91% 47%,100% 69%,78% 96%,55% 88%,33% 100%,8% 82%,0 55%,8% 28%)}
body.meteor-mode .met.cur{filter:drop-shadow(0 0 12px #ffe08a) drop-shadow(0 0 5px #fff)} body.meteor-mode .met i{color:#fff2a8}
body.meteor-mode .met::after{display:none!important;content:none!important}
body.meteor-mode .met::before{border:0!important;outline:0!important;box-shadow:inset -12px -10px 15px #080d19,inset 5px 4px 9px #f0c99a66!important}
body.meteor-mode .met{outline:0!important;border:0!important;box-shadow:none!important}
body.meteor-mode .base{z-index:5;left:50%;bottom:clamp(120px,16vh,160px);width:170px;height:145px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center}
.meteor-village{position:absolute;z-index:2;left:0;right:0;bottom:0;height:24%;display:flex;align-items:flex-end;justify-content:space-around;gap:8px;padding:0 4%;opacity:.95}
.meteor-village i{display:block;position:relative;width:clamp(42px,8vw,94px);height:clamp(48px,12vh,105px);background:linear-gradient(135deg,#8a6a52,#5a4333);border:2px solid #3b2b20;border-bottom:0;border-radius:5px 5px 0 0}
.meteor-village i:before{content:"";position:absolute;left:50%;top:-17px;transform:translateX(-50%);border-left:calc(clamp(42px,8vw,94px)/2) solid transparent;border-right:calc(clamp(42px,8vw,94px)/2) solid transparent;border-bottom:18px solid #f5fbff}

.td-sk small{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:9px;line-height:1.2;color:#eef3ff;background:#0b1326cc;border-radius:0 0 12px 12px;padding:1px 0;white-space:nowrap;overflow:hidden}
.td-sk:disabled{opacity:.45;cursor:default}
.td-sk.empty{border-style:dashed;background:transparent}
.td-sk.armed{border-color:#ffd84d;box-shadow:0 0 0 3px #ffd84d99,0 3px 0 #0b1326}
.td-loadout{display:grid;gap:10px;margin-top:12px}
.td-loadout label{display:grid;gap:4px;font-weight:700}
.td-loadout select{font:inherit;padding:8px;border-radius:10px;border:2px solid #17233a}
.sk-ic{display:grid;place-items:center}
.sk-ic svg{width:70%;height:70%}
.td-en.frozen i{box-shadow:0 0 0 3px #bfeeff,0 0 14px #7fd8ff}
.rig-svg.ghost{opacity:.4}
.quit-btn{margin-left:auto;align-self:center;padding:6px 12px;font-size:14px}
.att-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.att-cell{border:2px solid #17233a;border-radius:10px;padding:6px 2px;text-align:center;background:#fff}
.att-cell small{display:block;color:#5b6b85;font-size:11px}
.att-cell b{font-size:14px}
.att-cell.on{background:#fff6c2;box-shadow:0 3px 0 #17233a}
@media(max-width:560px){.att-row{grid-template-columns:repeat(4,1fr)}}
.td-field{top:70px;bottom:118px}
.td-bar{height:118px;padding:8px 14px;gap:4px}
.td-bar input{padding:7px 12px;font-size:18px}
.td-prompt{font-size:clamp(20px,3.2vw,28px)}
.td-bar .mute{display:none}
.td-panel{top:8px;bottom:8px;right:10px;width:min(290px,calc(100% - 20px));height:auto;max-height:none;overflow-y:auto;overscroll-behavior:contain;padding:10px;-webkit-overflow-scrolling:touch}
.td-list{gap:6px}
.td-item{padding:6px 8px}
.td-item small{font-size:11px;line-height:1.3}
.td-stat{margin:4px 0 6px;font-size:13px;line-height:1.5}
@media(max-width:640px){.td-field{bottom:124px}.td-bar{height:124px}.td-panel{top:6px;bottom:6px;width:calc(100% - 20px)}}
@media(min-width:900px){.td-field{right:282px}.td-panel{top:0;bottom:0;right:-282px;width:282px;height:auto;border-radius:0;background:#0f1a2e;border-width:0 0 0 1px;overflow-y:auto}}
@media(max-width:640px){.td-field{top:104px}.td-hud{padding:6px 8px;gap:6px 10px;top:6px;left:6px;right:6px}.td-hud b{font-size:17px}.td-hud>div span{font-size:11px}.td-hud .td-btn{padding:4px 8px;font-size:12px}.td-sk{width:44px;height:44px}}
.mk-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed #b8c2d6}
.mk-row>span:first-child{font-weight:700;min-width:140px}
.td-bolt{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;overflow:visible;animation:tdflick .3s steps(2,end) forwards}
.td-bolt polyline{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.td-bolt .bolt-glow{stroke:#ffe94d;stroke-width:9;opacity:.45}
.td-bolt .bolt-core{stroke:#fff8b0;stroke-width:3}
@keyframes tdflick{0%{opacity:1}25%{opacity:.35}50%{opacity:1}75%{opacity:.5}100%{opacity:0}}

const LocalStore=(()=>{
  const K='tadak.v1',S='tadak.session',empty=()=>({users:{},scores:[]});
  const load=()=>{try{return JSON.parse(LS.getItem(K))||empty()}catch{return empty()}};
  const save=d=>LS.setItem(K,JSON.stringify(d));
  const hash=async(p,salt)=>{
    if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    let n=5381;for(const c of salt+p)n=(n*33^c.charCodeAt(0))>>>0;return n.toString(16)};
  const cur=d=>d.users[LS.getItem(S)];
  return{
    scope:'이 브라우저에 저장된 기록이에요.',
    async init(){},
    async signup(nick,pw){const d=load(),k=nick.toLowerCase();
      if(d.users[k])throw Error('이미 사용 중인 닉네임이에요.');
      const salt=Math.random().toString(36).slice(2);
      d.users[k]={nick,salt,hash:await hash(pw,salt),color:COLORS[Object.keys(d.users).length%6],at:Date.now(),pts:0,own:[],eq:{...DEF},lang:'ko',avatar:null};
      save(d);LS.setItem(S,k)},
    async login(nick,pw){const d=load(),k=nick.toLowerCase(),u=d.users[k];
      if(!u||u.hash!==await hash(pw,u.salt))throw Error('닉네임이나 비밀번호가 맞지 않아요.');
      LS.setItem(S,k)},
    me(){const d=load(),k=LS.getItem(S);return d.users[k]?{...d.users[k],k}:null},
    logout(){LS.removeItem(S)},
    async deleteAccount(){const d=load(),k=LS.getItem(S);if(!k||!d.users[k])throw Error('로그인이 필요해요.');delete d.users[k];d.scores=d.scores.filter(s=>s.u!==k);save(d);LS.removeItem(S)},
    async redeem(){throw Error('포인트 코드는 서버에서만 쓸 수 있어요.')},
    async patch(o){const d=load(),u=cur(d);if(!u)return;
      if(o.color&&/^#[0-9a-f]{6}$/i.test(o.color))u.color=o.color;
      if('avatar' in o)u.avatar=o.avatar||null;
      if(o.lang==='ko'||o.lang==='en')u.lang=o.lang;save(d)},
    async buyConsumable(id){const d=load(),u=cur(d),it=(ITEMS.active||[]).find(i=>i[0]===id);if(!u||!it)throw Error('없는 아이템이에요.');if((u.pts||0)<it[2])throw Error('포인트가 부족해요.');u.pts-=it[2];u.inv=u.inv||{};u.inv[id]=(u.inv[id]||0)+1;save(d)},
    async useConsumable(id){const d=load(),u=cur(d);if(!u||!(u.inv||{})[id])throw Error('보유한 스킬이 없어요.');u.inv[id]--;if(!u.inv[id])delete u.inv[id];save(d)},
    async equip(slot,id){const d=load(),u=cur(d),it=(ITEMS[slot]||[]).find(i=>i[0]===id);
      if(!u||!it)throw Error('없는 아이템이에요.');
      u.own=u.own||[];u.pts=u.pts||0;let bought=false;
      if(it[2]>0&&!u.own.includes(id)){if(u.pts<it[2])throw Error('포인트가 부족해요.');u.pts-=it[2];u.own.push(id);bought=true}
      u.eq={...DEF,...u.eq,[slot]:id};save(d);return bought},
    async addScore(r){const d=load();d.scores.push(r);if(d.scores.length>3000)d.scores.splice(0,d.scores.length-3000);
      const u=d.users[r.u];if(u)u.pts=(u.pts||0)+r.pts;save(d)},
    async top(mode,lang,n){const d=load(),b={};
      for(const s of d.scores)if(s.mode===mode&&(s.lang||'ko')===lang&&(!b[s.u]||s.score>b[s.u].score))b[s.u]=s;
      return Object.values(b).filter(s=>d.users[s.u]).map(s=>({...s,max:s.max||s.cpm,nick:d.users[s.u].nick,color:d.users[s.u].color,eq:d.users[s.u].eq,avatar:d.users[s.u].avatar})).sort((a,c)=>c.score-a.score).slice(0,n)},
    async mine(k){return load().scores.filter(s=>s.u===k).map(s=>({...s,max:s.max||s.cpm,lang:s.lang||'ko'}))}
  }})();

const SupaStore=(()=>{
  let ME=null,MT=null;const TK='tadak.token',SSG=()=>{try{return sessionStorage}catch(e){return null}},tok=()=>MT||SSG()?.getItem(TK)||LS.getItem(TK);
  const rpc=async(fn,a)=>{let r;
    try{r=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(a)})}
    catch{throw Error('서버에 연결하지 못했어요. 인터넷을 확인해 주세요.')}
    const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{}
    if(!r.ok)throw Error(j&&j.message||'문제가 생겼어요. 잠시 뒤에 다시 해 주세요.');return j};
  return{
    scope:'우리 반 모두의 기록이에요.',
    async notice(){return rpc('tadak_notice',{})},
    async attend(){ME=await rpc('tadak_attend',{p_token:tok(),p_ver:APP_VERSION})},
    async chatSend(text){await rpc('tadak_chat_send',{p_token:tok(),p_text:text,p_ver:APP_VERSION})},
    async setBio(t){ME=await rpc('tadak_set_bio',{p_token:tok(),p_bio:t,p_ver:APP_VERSION})},
    async setNick(n){ME=await rpc('tadak_set_nick',{p_token:tok(),p_nick:n,p_ver:APP_VERSION})},
    async chatList(){return rpc('tadak_chat_list',{p_ver:APP_VERSION,p_limit:60})},
    async adminList(){return rpc('tadak_admin_list',{p_token:tok(),p_ver:APP_VERSION})},
    async adminTake(k,pts,item){await rpc('tadak_admin_take',{p_token:tok(),p_target:k,p_pts:pts||0,p_item:item||null,p_ver:APP_VERSION})},
    async adminSuspend(k,hours){await rpc('tadak_admin_suspend',{p_token:tok(),p_target:k,p_hours:hours,p_ver:APP_VERSION})},
    async clanInfo(){return rpc('tadak_clan_info',{p_token:tok(),p_ver:APP_VERSION})},
    async clanCreate(n){ME=await rpc('tadak_clan_create',{p_token:tok(),p_name:n,p_ver:APP_VERSION})},
    async clanJoin(id){ME=await rpc('tadak_clan_join',{p_token:tok(),p_id:id,p_ver:APP_VERSION})},
    async clanLeave(){ME=await rpc('tadak_clan_leave',{p_token:tok(),p_ver:APP_VERSION})},
    async marketInfo(){return rpc('tadak_market_info',{p_token:tok(),p_ver:APP_VERSION})},
    async marketSell(i,p){ME=await rpc('tadak_market_sell',{p_token:tok(),p_item:i,p_price:p,p_ver:APP_VERSION})},
    async marketCancel(id){ME=await rpc('tadak_market_cancel',{p_token:tok(),p_id:id,p_ver:APP_VERSION})},
    async marketBuy(id){ME=await rpc('tadak_market_buy',{p_token:tok(),p_id:id,p_ver:APP_VERSION})},
    async marketBuySystem(i){ME=await rpc('tadak_market_buy_system',{p_token:tok(),p_item:i,p_ver:APP_VERSION})},
    async init(){if(tok())try{ME=await rpc('tadak_me',{p_token:tok(),p_ver:APP_VERSION})}catch(e){if(/로그인/.test(e.message))LS.removeItem(TK)}},
    async signup(n,p){const r=await rpc('tadak_signup',{p_nick:n,p_pw:p,p_ver:APP_VERSION});LS.setItem(TK,r.token);SSG()?.setItem(TK,r.token);MT=r.token;ME=r.me},
    async login(n,p){const r=await rpc('tadak_login',{p_nick:n,p_pw:p,p_ver:APP_VERSION});LS.setItem(TK,r.token);SSG()?.setItem(TK,r.token);MT=r.token;ME=r.me},
    me:()=>ME,
    logout(){const t=tok();LS.removeItem(TK);SSG()?.removeItem(TK);MT=null;ME=null;if(t)rpc('tadak_logout',{p_token:t}).catch(()=>{})},
    async deleteAccount(){await rpc('tadak_delete_account',{p_token:tok()});LS.removeItem(TK);ME=null},
    async redeem(code){ME=await rpc('tadak_redeem',{p_token:tok(),p_code:code.trim()});return true},
    async patch(o){ME=await rpc('tadak_update',{p_token:tok(),p_color:o.color??null,p_avatar:'avatar' in o?(o.avatar||''):null,p_lang:o.lang??null})},
    async buyConsumable(id){ME=await rpc('tadak_buy_consumable',{p_token:tok(),p_item:id})},
    async useConsumable(id){ME=await rpc('tadak_use_consumable',{p_token:tok(),p_item:id})},
    async equip(slot,id){const n=(ME.own||[]).length;ME=await rpc('tadak_equip',{p_token:tok(),p_slot:slot,p_id:id});return ME.own.length>n},
    async addScore(r){ME=await rpc('tadak_submit',{p_token:tok(),p_mode:r.mode,p_lang:r.lang,p_cpm:r.cpm,p_max:r.max,p_acc:r.acc,p_score:r.score,p_pts:r.pts,p_wave:r.wave??null,p_ver:APP_VERSION})},
    top:(mode,lang,n)=>rpc('tadak_top',{p_mode:mode,p_lang:lang,p_n:n}),
    submitTeam:(code,r)=>rpc('tadak_submit_team',{p_token:tok(),p_code:code,p_lang:r.lang,p_score:r.score,p_cpm:r.cpm,p_acc:r.acc,p_wave:r.wave,p_kills:r.kills,p_ver:APP_VERSION}),
    topTeam:(lang,n)=>rpc('tadak_top_team',{p_lang:lang,p_n:n}),
    questList:()=>rpc('tadak_quest_list',{p_token:tok(),p_ver:APP_VERSION}),
    async questClaim(id){const r=await rpc('tadak_quest_claim',{p_token:tok(),p_id:id,p_ver:APP_VERSION});if(ME&&r&&r.pts!=null)ME={...ME,pts:r.pts};return r&&r.reward||0},
    mine:()=>rpc('tadak_mine',{p_token:tok()}),
    roomCreate:()=>rpc('tadak_room_create',{p_token:tok(),p_ver:APP_VERSION}),
    roomJoin:c=>rpc('tadak_room_join',{p_token:tok(),p_code:c,p_ver:APP_VERSION}),
    roomState:c=>rpc('tadak_room_state',{p_token:tok(),p_code:c,p_ver:APP_VERSION}),
    roomStart:c=>rpc('tadak_room_start',{p_token:tok(),p_code:c,p_ver:APP_VERSION}),
    roomPoll:c=>rpc('tadak_room_poll',{p_token:tok(),p_code:c,p_ver:APP_VERSION}),
    roomLeave:c=>rpc('tadak_room_leave',{p_token:tok(),p_code:c,p_ver:APP_VERSION}),
    roomDiff:(c,d)=>rpc('tadak_room_set_diff',{p_token:tok(),p_code:c,p_diff:d,p_ver:APP_VERSION}),
    roomPush:(c,st)=>rpc('tadak_room_push',{p_token:tok(),p_code:c,p_state:st,p_ver:APP_VERSION}),
    roomAct:(c,a)=>rpc('tadak_room_act',{p_token:tok(),p_code:c,p_action:a,p_ver:APP_VERSION}),
    roomTake:c=>rpc('tadak_room_take_actions',{p_token:tok(),p_code:c,p_ver:APP_VERSION})
  }})();

  c.addEventListener('pointerdown',ev=>{ev.preventDefault();c.setPointerCapture(ev.pointerId);DW.stack.push(x.getImageData(0,0,c.width,c.height));if(DW.stack.length>30)DW.stack.shift();DW.drawing=true;DW.last=pos(ev);line(DW.last,DW.last)});
  c.addEventListener('pointermove',ev=>{if(!DW||!DW.drawing)return;const p=pos(ev);line(DW.last,p);DW.last=p});
  const end=()=>{if(DW)DW.drawing=false};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function undoDraw(){if(DW&&DW.stack.length)DW.x.putImageData(DW.stack.pop(),0,0)}
function clearDraw(){if(!DW)return;DW.stack.push(DW.x.getImageData(0,0,DW.c.width,DW.c.height));DW.x.globalCompositeOperation='source-over';DW.x.clearRect(0,0,DW.c.width,DW.c.height)}
async function saveDraw(){if(!DW)return;const {c,x}=DW,px=x.getImageData(0,0,c.width,c.height).data;let any=false;for(let i=3;i<px.length;i+=4)if(px[i]){any=true;break}
  if(!any)throw Error('먼저 그림을 그려 주세요.');
  const t=document.createElement('canvas');t.width=t.height=160;t.getContext('2d').drawImage(c,0,0,160,160);
  await Store.patch({avatar:t.toDataURL('image/png')});go('profile')}

async function bgmStart(){try{
  if(!BGM.ctx)BGM.ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(BGM.ctx.state==='suspended')await BGM.ctx.resume();
  if(BGM.src)return;
  if(!BGM.buf){const bin=atob(BGM.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);BGM.buf=await BGM.ctx.decodeAudioData(u.buffer)}
  if(BGM.src)return;
  BGM.gain=BGM.ctx.createGain();BGM.gain.gain.value=BGM.vol;BGM.gain.connect(BGM.ctx.destination);
  BGM.src=BGM.ctx.createBufferSource();BGM.src.buffer=BGM.buf;BGM.src.loop=true;BGM.src.connect(BGM.gain);BGM.src.start();
}catch(e){}}
function bgmSet(v){BGM.vol=Math.max(0,Math.min(0.2,v));if(BGM.gain)BGM.gain.gain.value=BGM.vol;try{localStorage.setItem('tadak.bgm',String(BGM.vol))}catch(e){}}
try{const sv=parseFloat(localStorage.getItem('tadak.bgm'));if(!isNaN(sv))BGM.vol=Math.max(0,Math.min(0.2,sv))}catch(e){}
function bgmSlider(){if(document.getElementById('bgm-box'))return;const box=document.createElement('div');box.id='bgm-box';
  box.style.cssText='position:fixed;left:12px;bottom:12px;z-index:50;display:flex;align-items:center;gap:8px;padding:6px 12px;border:2px solid #0b1326;border-radius:999px;background:#fff;box-shadow:0 2px 0 #0b1326;font:700 13px \'Noto Sans KR\',sans-serif;color:#0b1326;opacity:.9';
  box.innerHTML='<span>♪</span><input id="bgm-vol" type="range" min="0" max="0.2" step="0.01" value="'+BGM.vol+'" style="width:120px;accent-color:#0b1326"><span id="bgm-v" style="min-width:34px">'+BGM.vol.toFixed(2)+'</span>';
  document.body.appendChild(box);
  const r=box.querySelector('#bgm-vol');
  r.addEventListener('input',()=>{bgmSet(+r.value);box.querySelector('#bgm-v').textContent=BGM.vol.toFixed(2);bgmStart()});
  r.addEventListener('pointerdown',e=>e.stopPropagation());
  r.addEventListener('keydown',e=>e.stopPropagation())}
bgmSlider();
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>bgmStart(),{passive:true}));
function isKim(){const m=Store.me();return !!(m&&m.nick&&m.nick.toLowerCase()==='kimyeoli')}
function suspTime(x){const v=x.susp_until;if(!v)return 0;const t=Date.parse(String(v).replace(/(\.\d{3})\d+/,'$1'));return isNaN(t)?0:t}
function suspActive(x){return suspTime(x)>Date.now()}
function suspLabel(x){return suspActive(x)?`정지 중 (${new Date(suspTime(x)).toLocaleString('ko-KR')}까지)`:'정상'}
async function vAdmin(){if(!isKim())return layout('<section class="card"><h3>관리자</h3><p class="mute">권한이 없어요.</p></section>','');const msg=note;note='';let list;
  try{list=await Store.adminList()}catch(e){return layout(`<section class="card"><h3>관리자</h3><p class="mute">${esc(e.message)}</p></section>`,'')}
  ADM_LIST=list||[];
  const rows=ADM_LIST.map((x,i)=>{const own=x.own||[];
    const items=own.map(id=>esc(itemName(id))).join(', ')||'없음';
    const opts=own.map(id=>`<option value="${esc(id)}">${esc(itemName(id))}</option>`).join('');
    return `<section class="card" style="margin-top:12px"><h3>${esc(x.nick)} <small class="mute">(${esc(x.k)})</small></h3><p>포인트 <b>${x.pts}</b> · 보유: ${items}</p>
      <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><input type="number" min="1" id="ap-${i}" placeholder="뺄 포인트" style="width:130px;padding:6px;border:2px solid var(--ink);border-radius:8px"><button class="btn" data-a="adm-pts" data-v="${i}">포인트 빼기</button>${own.length?`<select id="ai-${i}" style="padding:6px;border-radius:8px">${opts}</select><button class="btn" data-a="adm-item" data-v="${i}">아이템 빼기</button>`:''}</div><div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap;margin-top:10px"><b class="small">${suspLabel(x)}</b><input type="number" min="1" max="8760" id="sh-${i}" placeholder="정지 시간(시간)" style="width:150px;padding:6px;border:2px solid var(--ink);border-radius:8px"><button class="btn danger" data-a="adm-suspend" data-v="${i}">시간만큼 정지</button><button class="btn" data-a="adm-unsuspend" data-v="${i}">정지 해제</button></div></section>`}).join('');
  return layout(`<section class="rhead"><h2>관리자 모드</h2><p class="mute">유저의 포인트와 아이템을 확인하고 뺄 수 있어요.</p></section>${msg?`<p style="font-weight:700">${esc(msg)}</p>`:''}${rows||'<p class="mute">유저가 없어요.</p>'}`,'')}
let ROOM=null,ROOM_KEY='',ROOM_POLL=null;
function roomPoll(){if(ROOM_POLL)return;ROOM_POLL=setInterval(async()=>{if(!ROOM||location.hash!=='#tdmulti')return;try{const pl=await Store.roomPoll(ROOM);if(pl.status==='playing'){const c=ROOM;ROOM=null;clearInterval(ROOM_POLL);ROOM_POLL=null;const stt=await Store.roomState(c);const me=stt.members.find(m=>m.me);startTD({code:c,seed:pl.seed,lane:me?me.lane:'bottom',diff:stt.diff});return}const st=await Store.roomState(ROOM);const k=JSON.stringify([st.members,st.diff]);if(k!==ROOM_KEY){ROOM_KEY=k;route()}}catch(e){}},2000)}

function DIFF_UI(st){const me=st.members.find(m=>m.me);const host=me&&['top','both'].includes(me.lane);const cur=st.diff||'normal';

  G={mode,lang,pool:shuffle(TEXT[lang][mode].slice()),i:0,hit:0,tot:0,max:0,ts:0,t0:0,comp:false};R=null;go('game')}
const cur=()=>G.pool[G.i%G.pool.length];
function paint(){const t=cur(),v=$('#in').value;
  $('#tg').innerHTML=[...t].map((c,i)=>{let k='';
    if(i<v.length)k=v[i]===c?'ok':(i===v.length-1&&G.comp?'cur':'bad');else if(i===v.length)k='cur';
    return`<span class="${k}">${c}</span>`}).join('');
  $('#nx').textContent=G.pool[(G.i+1)%G.pool.length]}
function tick(){if(!G||!G.t0)return;
  const el=(performance.now()-G.t0)/1000,left=Math.max(0,60-el);
  $('#tl').textContent=Math.ceil(left);$('#pb').style.width=left/60*100+'%';
  $('#cp').textContent=el>2?Math.round(G.hit/(el/60)):0;$('#ac').textContent=G.tot?Math.round(G.hit/G.tot*100):100;
  if(left<=0)finish()}
function submit(){const inp=$('#in'),t=cur(),v=inp.value.trim();
  if(!v){inp.value='';return}
  let h=0;const st=strokes(t);for(let i=0;i<t.length;i++)if(v[i]===t[i])h+=strokes(t[i]);
  if(h===st&&G.ts){const d=(performance.now()-G.ts)/1000;if(d>.5)G.max=Math.max(G.max,Math.round(st/d*60))}
  G.hit+=h;G.tot+=st;G.i++;G.ts=0;
  const tg=$('#tg');tg.classList.remove('no');void tg.offsetWidth;if(h<st)tg.classList.add('no');
  inp.blur();inp.value='';inp.focus();paint();tick()}

  inp.addEventListener('input',()=>{if(!G)return;
    if(!G.t0){G.t0=performance.now();timer=setInterval(tick,100)}
    if(!G.ts&&inp.value)G.ts=performance.now();

  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&G){e.preventDefault();submit()}})}

const TD_RPM={blaster:[1,.9,.8,.7,.6]};

function tdStats(t,i){const s=TD_T[t.type],m=(TD_UPM[t.type]||[1,1.8,3,4.5,6.5])[t.lvl-1]||1,r=(TD_RPM[t.type]||[1,.85,.7,.6,.5])[t.lvl-1]||.5;const sb=tdSupplyBoost(i);let dmg=s.dmg*m*(UPF(i).dmg)*sb*(TD&&TD.tal?TD.tal.dmgMul:1);if(t.type==='inferno')dmg*=Math.min(3,1+0.15*(t.focusN||0));if(t.type==='laser')dmg*=Math.pow(.7,UPF(i).pierce);return{dmg:Math.round(dmg*10)/10,rate:s.rate*r*(UPF(i).rate)/sb,range:s.range+((TD_RADD[t.type]||[0,2,4,6,8])[t.lvl-1]??8)+(UPF(i).range)+(TD&&TD.tal?TD.tal.range:0),splash:s.splash,pierce:s.pierce,slow:s.slow,chain:s.chain||0}}
const TD_AUGMENTS=[{id:'dmg',icon:'⚔️',name:'강력한 무기',desc:'타워 공격력 +15%'},{id:'range',icon:'🔭',name:'망원 렌즈',desc:'타워 사거리 +2'},{id:'rate',icon:'⚡',name:'고속 장전',desc:'타워 공속 +15%'},{id:'discount',icon:'🏷️',name:'건축가',desc:'설치/업글 비용 -10% (최대 -30%)'},{id:'chain',icon:'🔗',name:'연쇄 공격',desc:'탄이 맞으면 15% 확률로 근처 적에게 절반 피해 (최대 45%)'},{id:'skill',icon:'🌟',name:'스킬 위력',desc:'얼음 +1초, 번개 피해 +10%'},{id:'refund',icon:'💰',name:'환급 장인',desc:'타워 판매 환급 +20%'},{id:'gold',icon:'🪙',name:'대부호',desc:'즉시 100 골드 획득'},{id:'crit',icon:'🎯',name:'정밀 사격',desc:'타워 공격 10% 확률로 2배 피해 (최대 40%)'},{id:'splash',icon:'💥',name:'폭발 반경',desc:'대포 타워 폭발 범위 +2'},{id:'pierce',icon:'🔱',name:'관통 강화',desc:'레이저 관통 대상 +1, 레이저 공격력 -30% (최대 2번)'},{id:'slowDur',icon:'🧊',name:'빙결 연장',desc:'얼음 둔화 지속 +1초'},{id:'interest',icon:'🏦',name:'복리',desc:'웨이브 클리어 보상 +5% 골드 (최대 15%)'},{id:'word',icon:'✏️',name:'타자 장인',desc:'낱말 하나당 골드 +1'}];
function tdRenderAugmentUI(){const cards=shuffle(TD_AUGMENTS.filter(a=>!(a.id==='refund'&&TD.up.refund>=2)&&!(a.id==='pierce'&&TD.up.pierce>=2))).slice(0,3);let layer=document.getElementById('tdUpgradeScreen');if(!layer){layer=document.createElement('div');layer.className='upgrade-screen';layer.id='tdUpgradeScreen';$('.td-wrap').appendChild(layer)}layer.innerHTML=`<div class="upgrade-panel"><h2>증강 선택</h2><p>3웨이브마다 주어지는 특수 능력 (1개만 선택 가능)</p><div class="upgrade-cards">${cards.map(c=>`<button class="upgrade-card" data-a="td-aug" data-v="${c.id}"><span class="emoji">${c.icon}</span><b>${c.name}</b><span>${c.desc}</span></button>`).join('')}</div><div style="margin-top:16px"><button class="btn" data-a="td-reroll" ${TD.reroll<=0?'disabled':''}>새로고침 (남은 횟수: ${TD.reroll})</button></div></div>`;}

function tdCost(s,i){return Math.round(s.cost*UPF(i).discount*(TD&&TD.tal?TD.tal.costMul:1))}

function applyAugUp(U,id){if(id==='dmg')U.dmg*=1.15;if(id==='range')U.range+=2;if(id==='rate')U.rate*=0.85;if(id==='discount')U.discount=Math.max(.7,U.discount*.9);if(id==='chain')U.chain=Math.min(.45,U.chain+.15);if(id==='skill')U.skill+=1;if(id==='refund')U.refund+=1;if(id==='crit')U.crit=Math.min(.4,U.crit+.1);if(id==='splash')U.splash+=2;if(id==='pierce')U.pierce+=1;if(id==='slowDur')U.slowDur+=1;if(id==='interest')U.interest=Math.min(.15,U.interest+.05);if(id==='word')U.word+=1}

function guestPickAug(id){if(TD.guestRound==null)return;const round=TD.guestRound;if(id!=='gold')applyAugUp(TD.up,id);tdSendAct({k:'aug',id,r:round});TD.augDone=round;TD.guestRound=null;$('#tdUpgradeScreen')?.remove()}
function tdBuyAugment(id){if(!TD||!TD.shopOpen)return;const U=TD.up;if(id==='dmg')U.dmg*=1.15;if(id==='range')U.range+=2;if(id==='rate')U.rate*=0.85;if(id==='discount')U.discount=Math.max(.7,U.discount*.9);if(id==='chain')U.chain=Math.min(.45,U.chain+.15);if(id==='skill')U.skill+=1;if(id==='refund')U.refund+=1;if(id==='gold')TD.gold+=100;if(id==='crit')U.crit=Math.min(.4,U.crit+.1);if(id==='splash')U.splash+=2;if(id==='pierce')U.pierce+=1;if(id==='slowDur')U.slowDur+=1;if(id==='interest')U.interest=Math.min(.15,U.interest+.05);if(id==='word')U.word+=1;tdCloseAugmentShop();}
function tdRerollAugment(){if(!TD||!(TD.shopOpen||TD.guestRound!=null)||TD.reroll<=0)return;TD.reroll--;tdRenderAugmentUI();}
function tdCloseAugmentShop(){if(!TD)return;$('#tdUpgradeScreen')?.remove();TD.shopOpen=false;$('#tdi')?.focus();}
function tdQueue(w,hm=1,cm=1){const n=Math.round((4+w*2)*cm),q=[],pm=Math.pow(1.1,Math.floor(w/10));for(let i=0;i<n;i++){const k=i%4,light=k===1,tank=k===3;q.push({boss:false,fast:light,tank,hp:30*(1+w)*(light?.5:tank?2:1)*pm*hm,sp:(3+w*.2+(TD.rnd?TD.rnd():Math.random()))*.8*(light?2:tank?.6:1)})}
  if(w%5===0)q.push({boss:true,hp:600*(1+w)*pm*hm,sp:(3+w*.05)*.8});return q}

// offset: 0 = 적의 오른쪽 끝이 기지 왼쪽 끝에 닿았을 때 공격 판정

function tdLeakX(e){const f=$('#tdf'),av=$('.td-base .av'),bs=$('.td-base');if(!f||!av||!bs)return 88;
  const W=f.clientWidth||600,baseLeft=bs.offsetLeft+av.offsetLeft,half=e.boss?32:e.fast?11:e.tank?20:17;
  return Math.max(10,Math.min(100,(baseLeft+TD_BASE_HIT.offset-half)/W*100))}

function tdStartWave(){TD.phase='wave';const cm=TD.coop?1.4:1;TD.queue=tdQueue(TD.wave,TD_DIFF[TD.diff||'normal'].hp*cm,cm);TD.st=.6;TD.reached=Math.max(TD.reached||0,TD.wave);
  const nu=Object.entries(TD_T).filter(([,v])=>v.unlock===TD.wave);
  let msg=TD.wave%5===0?`⚠️ 보스 출현! 웨이브 ${TD.wave} ⚠️`:`웨이브 ${TD.wave} 시작!`;

function tdHit(e,d){if(e.dead||e.leak)return;e.hp-=d;if(e.hp<=0){e.dead=true;TD.kills++}}
function tdFx(x1,y1,x2,y2,c){const s=$('#tdfx');if(!s)return;const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',c);l.setAttribute('class','td-ln');s.appendChild(l);setTimeout(()=>l.remove(),180)}
function tdVis(){const f=$('#tdf');return f?[f.clientWidth,f.clientHeight]:[600,400]}
function tdProj(type,sx,sy,tx,ty,dur){const L=$('#tdfxl');if(!L)return;const [W,H]=tdVis();
  if(type==='mortar'){const [W,H]=tdVis();const x0=sx/100*W,y0=sy/100*H,xt=tx/100*W,yt=ty/100*H;
    // 고각 60도 발사 (포신 30도 기울기와 동일). 수평 속도는 일정, 수직은 중력으로 떨어짐. 착탄 시간 dur에 맞춰 중력을 계산.
    const R=xt-x0,Ra=Math.abs(R),th=Math.PI/3,T=dur,D=y0-yt;
    const vx=R/T,vy=Ra*Math.tan(th)/T,g=2*(Ra*Math.tan(th)-D)/(T*T);
    const el=document.createElement('div');el.className='td-proj p-mortar';L.appendChild(el);
    const t0=performance.now();
    const step=now=>{const t=(now-t0)/1000;if(t>=T){el.remove();return}
      el.style.left=(x0+vx*t)+'px';el.style.top=(y0-(vy*t-0.5*g*t*t))+'px';el.style.transform='translate(-50%,-50%)';requestAnimationFrame(step)};
    requestAnimationFrame(step);return}
  const el=document.createElement('div');el.className='td-proj p-'+type;
  const ang=Math.atan2((ty-sy)/100*H,(tx-sx)/100*W)*180/Math.PI;
  el.style.left=sx+'%';el.style.top=sy+'%';el.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`;
  L.appendChild(el);el.animate([{left:sx+'%',top:sy+'%'},{left:tx+'%',top:ty+'%'}],{duration:dur*1000,easing:'linear',fill:'forwards'});
  setTimeout(()=>el.remove(),dur*1000+40)}
function tdBoom(x,r){const L=$('#tdfxl');if(!L)return;const [W,H]=tdVis();const d=document.createElement('div');d.className='td-boom';
  d.style.left=x+'%';d.style.top='50%';d.style.width=(2*r/100*W)+'px';d.style.height=Math.max(110,H*.3)+'px';L.appendChild(d);setTimeout(()=>d.remove(),550)}
function tdRing(x,col){const L=$('#tdfxl');if(!L)return;const d=document.createElement('div');d.className='td-ring';d.style.left=x+'%';d.style.top='50%';d.style.setProperty('--c',col);L.appendChild(d);setTimeout(()=>d.remove(),330)}
function tdBolt(sx,sy,tx,ty){const L=$('#tdfxl');if(!L)return;const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','td-bolt');
  const pts=[[sx,sy]];for(let i=1;i<=6;i++){const t=i/6;pts.push([sx+(tx-sx)*t+(Math.random()*2-1)*1.2,sy+(ty-sy)*t+(Math.random()*2-1)*5])}pts.push([tx,ty]);
  const p=pts.map(q=>q.join(',')).join(' ');
  const glow=document.createElementNS(ns,'polyline');glow.setAttribute('points',p);glow.setAttribute('class','bolt-glow');
  const core=document.createElementNS(ns,'polyline');core.setAttribute('points',p);core.setAttribute('class','bolt-core');
  svg.appendChild(glow);svg.appendChild(core);L.appendChild(svg);setTimeout(()=>svg.remove(),300)}
function tdBeam(sx,sy,tx,ty,col){const L=$('#tdfxl');if(!L)return;const [W,H]=tdVis();const x1=sx/100*W,y1=sy/100*H,x2=tx/100*W,y2=ty/100*H;
  const d=document.createElement('div');d.className='td-beam'+(col==='red'?' red':'');d.style.left=x1+'px';d.style.top=y1+'px';d.style.width=Math.hypot(x2-x1,y2-y1)+'px';
  d.style.transform=`rotate(${Math.atan2(y2-y1,x2-x1)*180/Math.PI}deg)`;L.appendChild(d);setTimeout(()=>d.remove(),260)}
function tdFireFx(x,r){const L=$('#tdfxl');if(!L)return;const [W,H]=tdVis();const d=document.createElement('div');d.className='td-fire';
  d.style.left=x+'%';d.style.top='50%';d.style.width=(2*r/100*W)+'px';d.style.height=Math.max(70,H*.22)+'px';L.appendChild(d);setTimeout(()=>d.remove(),3000)}
function tdKick(i){const tw=document.querySelector('#tds'+i+' .td-tw');if(!tw)return;tw.classList.add('shoot');setTimeout(()=>tw.classList.remove('shoot'),120)}
function tdFire(i,t,st,target){const sx=TD_SLOTS[i][0],sy=TD_SLOTS[i][1];
  const dmg=()=>Math.random()<UPF(i).crit?st.dmg*2:st.dmg;
  const vis=[];
  const aimX=target.x;
  const cands=TD.enemies.filter(e=>!e.dead&&!e.leak&&tdInRange(e,sx,sy,st.range));
  const aims=t.type==='spray'?sprayAngles(sx,sy,target):[];
  const apply=()=>{const alive=TD.enemies.filter(e=>!e.dead&&!e.leak);
    if(t.type==='roster'){const R=TD_T.roster.splash;const hits=alive.filter(e=>Math.abs(e.x-aimX)<=R);if(!target.dead&&!target.leak&&Math.abs(target.x-aimX)<=3.5&&!hits.includes(target))hits.push(target);if(!hits.length)tdMissFx(aimX);else hits.forEach(e=>tdHit(e,dmg()))}
    else if(t.type==='spray'){const prim=new Set();const [SW]=tdVis();const SR=st.range/100*SW;aims.forEach(a=>{alive.filter(e=>!e.dead&&!e.leak&&sprayHit(sx,sy,SR,a,e)).forEach(e=>{tdHit(e,dmg());if(!e.boss)e.frozen=Math.max(e.frozen||0,TD_T.spray.stun);prim.add(e)})});
      const chained=new Set(prim);prim.forEach(p0=>{let cur=p0;for(let k=0;k<TD_T.spray.chain;k++){const nx=TD.enemies.filter(x=>!chained.has(x)&&!x.dead&&!x.leak&&Math.abs(x.x-cur.x)<=10).sort((a,b)=>Math.abs(a.x-cur.x)-Math.abs(b.x-cur.x))[0];if(!nx)break;chained.add(nx);nx.slow=Math.max(nx.slow||0,.5);tdBolt(cur.x,50,nx.x,50);cur=nx}})}
    else if(t.type==='cannon'||t.type==='mortar'){const r=st.splash+UPF(i).splash;alive.filter(e=>Math.abs(e.x-target.x)<=r).forEach(e=>{const d=dmg();tdHit(e,e===target?d:d*.5)});if(t.type==='mortar'){(TD.fires=TD.fires||[]).push({x:target.x,r,t:3});tdFireFx(target.x,r)}}
    else if(t.type==='laser'){const inR=alive.filter(e=>tdInRange(e,sx,sy,st.range)&&e!==target).sort((a,b)=>b.x-a.x);
      [target,...inR].slice(0,st.pierce+UPF(i).pierce).forEach(e=>{tdHit(e,dmg());vis.push(e.x)})}
    else if(t.type==='elec'){vis.push(target.x);tdHit(target,dmg());if(!target.boss)target.frozen=Math.max(target.frozen||0,.1);const hit=new Set([target]);let cur=target,mul=1;
      for(let k=0;k<st.chain;k++){mul*=.7;const nx=alive.filter(x=>!hit.has(x)&&!x.dead&&Math.abs(x.x-cur.x)<=10).sort((a,b)=>Math.abs(a.x-cur.x)-Math.abs(b.x-cur.x))[0];if(!nx)break;hit.add(nx);tdHit(nx,st.dmg*mul);if(!nx.boss)nx.frozen=Math.max(nx.frozen||0,.1);tdBolt(cur.x,50,nx.x,50);vis.push(nx.x);cur=nx}}
    else if(t.type==='inferno'){const others=alive.filter(e=>e!==target&&tdInRange(e,sx,sy,st.range)).sort((a,b)=>b.x-a.x).slice(0,1);[target,...others].forEach(e=>{tdHit(e,dmg());vis.push(e.x);tdBeam(sx,sy,e.x,50,'red')})}
    else if(st.slow){const r=st.splash||0;alive.filter(e=>Math.abs(e.x-target.x)<=r).forEach(e=>{if(st.dmg>0)tdHit(e,dmg());e.slow=2+UPF(i).slowDur})}
    else{tdHit(target,dmg());if(st.slow)target.slow=2+UPF(i).slowDur;if(Math.random()<UPF(i).chain){const nb=alive.filter(x=>x!==target&&!x.dead).sort((a,b)=>Math.abs(a.x-target.x)-Math.abs(b.x-target.x))[0];if(nb&&Math.abs(nb.x-target.x)<=8)tdHit(nb,st.dmg*.5)}}};
  tdKick(i);
  if(t.type==='mortar')document.querySelector('#tds'+i+' .td-tw')?.classList.toggle('aim-r',target.x>sx);
  if(t.type==='laser'||t.type==='elec'){(t.type==='elec'?tdBolt:tdBeam)(sx,sy,target.x,50);apply();(TD.fx=TD.fx||[]).push({i,type:t.type,tx:target.x,ch:vis.slice()});return}
  if(t.type==='inferno'){apply();(TD.fx=TD.fx||[]).push({i,type:t.type,tx:target.x,ch:vis.slice()});return}
  const flight=t.type==='mortar'?.7:t.type==='cannon'?.4:t.type==='roster'?.6:t.type==='spray'?.3:.2;
  if(t.type==='spray'){const [VW]=tdVis();const VR=st.range/100*VW;aims.forEach(a=>{const e=sprayEnd(sx,sy,a,VR);tdProj('spray',sx,sy,e.x,e.y,flight);(TD.fx=TD.fx||[]).push({i,type:'spray',tx:e.x,flight,r:0,ch:[]})});(TD.impacts=TD.impacts||[]).push({t:flight,fn:apply,type:'spray',x:target.x,r:0,col:TD_T.spray.col});return}
  tdProj(t.type,sx,sy,target.x,50,flight);(TD.fx=TD.fx||[]).push({i,type:t.type,tx:target.x,flight,r:st.splash+UPF(i).splash,ch:[]});
  (TD.impacts=TD.impacts||[]).push({t:flight,fn:apply,type:t.type,x:target.x,r:st.splash+UPF(i).splash,col:TD_T[t.type].col})}

function tdHeatBar(i,t){const b=document.querySelector('#tds'+i);if(!b)return;let h=b.querySelector('.td-heat');if(!h){h=document.createElement('b');h.className='td-heat';h.innerHTML='<i></i>';b.appendChild(h)}const hot=(t.heat||0)>0;h.classList.toggle('hot',hot);h.firstChild.style.width=(hot?(t.heat/TD_T[t.type].cool*100):((t.burst||0)/TD_T[t.type].burst*100))+'%'}
function tdMissFx(x){const L=$('#tdfxl');if(!L)return;const d=document.createElement('div');d.className='td-miss';d.style.left=x+'%';d.style.top='50%';L.appendChild(d);setTimeout(()=>d.remove(),450)}
function tdTick(ts){if(!TD||TD.ended)return;const dt=Math.min(.05,(ts-(tdLast||ts))/1000)*(TD.speed||1);tdLast=ts;
  if(TD.shopOpen||TD.prep||TD.paused){if(TD.room&&!TD.guest)hostTake();tdRaf=requestAnimationFrame(tdTick);return;}
  if(TD.guest){guestSync();guestMove(dt/(TD.speed||1));tdHud();tdRaf=requestAnimationFrame(tdTick);return}
  if(TD.msgT>0)TD.msgT-=dt;
  if(TD.phase==='break'){TD.breakT-=dt;if(TD.breakT<=0){tdStartWave()}}
  else if(TD.queue.length){TD.st-=dt;if(TD.st<=0){const q=TD.queue.shift();const e={id:TD.nextId++,x:0,hp:q.hp,max:q.hp,sp:q.sp,slow:0,boss:q.boss,fast:q.fast,tank:q.tank};e.el=tdEnemyEl(e);TD.enemies.push(e);TD.st=Math.max(.45,1.2-TD.wave*.04)}}

  d.querySelector('.notice-body').textContent=text;
  document.body.appendChild(d);
  d.querySelector('#ntBtn').onclick=block?()=>{location.href=location.pathname+'?v='+Date.now()}:()=>d.remove()}
function inGame(){return /^#(td|game|meteor)$/.test(location.hash)}
async function checkVersion(){let info=null;try{info=await Store.notice()}catch{return}
  if(!info||!info.version||info.version===APP_VERSION)return info;
  if(inGame())return null;
  if(window.sessionStorage.getItem('taja.reloaded')!==info.version){
    window.sessionStorage.setItem('taja.reloaded',info.version);
    location.replace(location.pathname+'?v='+encodeURIComponent(info.version));return null}
  if(!document.getElementById('tdNotice'))showNoticeBox((info.notice||'새 버전이 나왔어요.')+`\n\n현재 버전 ${APP_VERSION} / 서버 최신 버전 ${info.version}\n업데이트를 받은 뒤에 이용할 수 있어요.`,true);
  return null}
async function bootApp(){const info=await checkVersion();
  if(info===null&&document.getElementById('tdNotice'))return;
  Store.init().then(route,route);
  if(info&&info.notice&&window.localStorage.getItem('taja.notice')!==info.version){window.localStorage.setItem('taja.notice',info.version);showNoticeBox(info.notice,false)}
  setInterval(()=>{if(!document.getElementById('tdNotice'))checkVersion()},120000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()});
  window.addEventListener('hashchange',()=>{if(!inGame())checkVersion()})}
if(!SB.url||!SB.key){document.getElementById('app').innerHTML='<section class="card" style="margin-top:40px"><h3>서버 설정이 필요해요</h3><p class="mute">SB 설정에 Supabase 주소와 anon 키를 넣어 주세요.</p></section>'}else bootApp();
</script>
</body>
</html>
