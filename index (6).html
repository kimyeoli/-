<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taja.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6faf5;--grid:#e1eae3;--ink:#17233a;--mute:#5d6b7e;--line:#cfd9d2;--acc:#2748c7;--accd:#1b349a;--hl:#ffd84d;--ok:#12935f;--bad:#e5484d}
*{box-sizing:border-box;margin:0}
body{font:500 16px/1.55 'Noto Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);min-height:100vh;
background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/30px 30px,var(--paper)}
h1,h2,h3,.brand,.logo,.av,.big,.stat b,.hud b,.rk,.sc{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:24px;max-width:960px;margin:0 auto;padding:18px 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;color:var(--ink);text-decoration:none}
.logo{width:34px;height:34px;border-radius:99px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 var(--accd)}
nav{display:flex;gap:4px;margin-right:auto}
nav a{padding:8px 16px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:700}
nav a.on{background:var(--ink);color:#fff}
.chip{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:4px 16px 4px 4px}
main{max-width:960px;margin:0 auto;padding:8px 20px 60px}
main>section,main>p{margin-top:14px}
.av{display:block;border-radius:50%;width:32px;height:32px;flex:none;overflow:hidden;border:1.5px solid var(--ink)}
.av svg{display:block;width:100%;height:100%}
.rig-svg .rig{transform-origin:50px 84px;animation:av-breathe 3.2s ease-in-out infinite}
.rig-svg .eyes{transform-origin:50px 56px;animation:av-blink 4.8s infinite}
.rig-svg .pupils{animation:av-glance 7s ease-in-out infinite}
.rig-svg .arm-l{transform-origin:20px 70px;animation:av-arm-l 3.2s ease-in-out infinite}
.rig-svg .arm-r{transform-origin:80px 70px;animation:av-arm-r 3.2s ease-in-out infinite}
.rig-svg .sway{animation:av-sway 2.8s ease-in-out infinite}
.rig-svg .flutter{animation:av-flutter 1.9s ease-in-out infinite}
.rig-svg .twinkle{animation:av-twinkle 2.4s ease-in-out infinite}
.rig-svg .pulse{animation:av-pulse 2.2s ease-in-out infinite}
@keyframes av-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.975)}}
@keyframes av-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes av-glance{0%,56%,100%{transform:translateX(0)}62%,72%{transform:translateX(-1.4px)}80%,90%{transform:translateX(1.4px)}96%{transform:translateX(0)}}
@keyframes av-arm-l{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes av-arm-r{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
@keyframes av-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes av-flutter{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.86)}}
@keyframes av-twinkle{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes av-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.rig-svg *{animation:none!important}}
.rig-svg.off *,body.bg .rig-svg *{animation-play-state:paused!important}
/* small avatars (lists, shop tiles, chat, rank) do not animate: the motion is too small to see and each one costs memory */
.av.xs .rig-svg *,.av.m .rig-svg *,.av.s .rig-svg *{animation:none!important}
.av.xs{width:28px;height:28px}.av.m{width:64px;height:64px}.av.l{width:96px;height:96px}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:22px}
.card h3{font-size:20px;margin-bottom:10px}
.btn{font:inherit;font-weight:700;display:inline-block;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:10px 20px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--ink)}
.btn:focus-visible,nav a:focus-visible,.seg button:focus-visible,.sw button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.mute{color:var(--mute)}.small{font-size:14px}
.tag,.pb{display:inline-block;background:var(--hl);font-weight:700;font-size:14px;padding:2px 12px;border-radius:999px}
.greet h2{font-size:34px;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat span{color:var(--mute);font-size:14px;font-weight:700;display:block}
.stat b{font-size:34px;line-height:1.3}.stat small{font:700 14px 'Noto Sans KR';color:var(--mute);margin-left:4px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:26px}
.mode h3{font-size:28px;margin:0}.mode p{flex:1;margin-bottom:10px}
.mode.w{background:var(--hl)}.mode.s{background:var(--acc);color:#fff}
.seg{display:inline-flex;background:#e3ebe5;border-radius:12px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:700;border:0;background:0;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.rhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.rhead h2{font-size:34px}
.rank{padding:8px}
table{width:100%;border-collapse:collapse}
th{color:var(--mute);font-size:14px;text-align:right;padding:12px 14px}
td{padding:12px 14px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:center;width:64px}th:nth-child(2),td:nth-child(2){text-align:left}
.who{display:flex;gap:10px;align-items:center;font-weight:700}
.rk{font-size:22px}.r1{color:#d49b00}.r2{color:#7b8794}.r3{color:#b36a2e}.sc{font-size:20px}
tr.me td{background:#fff8d6}
.empty{padding:36px;text-align:center;color:var(--mute)}
.game{padding:26px}
.bar{height:10px;background:#e3ebe5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--acc);border-radius:99px;transition:width .1s linear}
.hud{display:flex;gap:30px;margin:16px 0 4px}
.hud div{display:flex;align-items:baseline;gap:4px}.hud b{font-size:38px;min-width:2ch}.hud span{color:var(--mute);font-weight:700;font-size:14px}
.target{font:700 clamp(30px,5.2vw,50px)/1.4 'Noto Sans KR',sans-serif;min-height:2.9em;padding:20px 4px 8px;white-space:pre-wrap;word-break:keep-all;color:#8793a3}
.target span{border-radius:6px}.target .ok{color:var(--ink)}.target .bad{color:var(--bad);background:#fde7e7}.target .cur{background:var(--hl);color:var(--ink)}
.target.no{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nx{color:var(--mute);margin-bottom:12px}.nx b{color:var(--ink)}
#in{width:100%;font:700 26px 'Noto Sans KR',sans-serif;padding:14px 18px;border:2px solid var(--ink);border-radius:12px;background:#fff;outline:0}
#in:focus,label input:focus{border-color:var(--acc);box-shadow:0 0 0 4px #2748c726}
.hint{margin-top:10px}
.res{text-align:center;padding:36px 22px}
.big{font-size:clamp(84px,16vw,140px);line-height:1.05;color:var(--acc);margin:4px 0 10px}
.res .stats{max-width:700px;margin:22px auto;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.prof{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.pl{display:flex;gap:18px;align-items:center}.pl h2{font-size:32px;line-height:1.3}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 2.5px var(--ink)}
.cc{flex-direction:row;align-items:center;gap:8px}
.cc input{width:40px;height:32px;padding:0;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer}
.card h3:not(:first-child){margin-top:24px}
.pts{text-align:right}.pts span{display:block;color:var(--mute);font-size:14px;font-weight:700}
.pts b{font:400 44px/1.2 'Black Han Sans',sans-serif;color:var(--acc)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:16px}
.tile{font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.tile:hover{border-color:var(--ink)}
.tile.on{border-color:var(--ink);background:#fff8d6;box-shadow:0 0 0 1.5px var(--ink)}
.tile.no{opacity:.55}
.tile b{font-size:14px}.tile small{color:var(--mute);font-weight:700;font-size:13px}
.tile:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.spark{width:100%;max-width:520px;height:90px;margin-top:8px}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:var(--acc);color:#fff;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.hero .brand{color:#fff}.hero .logo{background:var(--hl);color:var(--ink);box-shadow:0 3px 0 #c9a200}
.hero h1{font-size:clamp(44px,5.4vw,68px);line-height:1.15;margin-bottom:16px}
.hero p{max-width:30ch;font-size:18px;opacity:.92}
.kr{display:flex;gap:6px;margin-bottom:6px}
.kr i{font-style:normal;width:40px;height:40px;border-radius:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);box-shadow:0 3px 0 rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;animation:press 3.3s var(--d) infinite}
@keyframes press{0%,86%,100%{transform:none}91%{transform:translateY(3px);box-shadow:0 0 0 transparent;background:var(--hl);color:var(--ink)}}
.panel{display:flex;flex-direction:column;justify-content:center;gap:22px;width:100%;max-width:520px;margin:auto;padding:44px clamp(24px,6vw,64px)}
#af{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
label input{font:500 17px 'Noto Sans KR',sans-serif;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;outline:0}
.err{color:var(--bad);font-weight:700;min-height:1.4em;font-size:14px}.note{color:var(--mute);font-size:13px}
.wide{width:100%;padding:14px}
@media(max-width:820px){.auth{grid-template-columns:1fr}.hero{padding:28px 24px;gap:14px}.keys{display:none}.top{flex-wrap:wrap;gap:10px}nav{order:3;width:100%}td,th{padding:10px 6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mode.m{background:var(--ink);color:#fff}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.rctl{display:flex;gap:10px;flex-wrap:wrap}
.seg.wrap{flex-wrap:wrap}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.btn.lang{font:400 24px 'Black Han Sans',sans-serif;min-width:88px}
.row.l{justify-content:flex-start}
.sky{position:relative;height:clamp(260px,calc(100vh - 340px),560px);overflow:hidden;border-radius:14px;border:1.5px solid var(--ink);background:radial-gradient(circle at 20% 20%,#3b4f93 0,transparent 40%),linear-gradient(#17233a,#25346a);margin-bottom:14px}
.sky.hurt{animation:hurt .3s}
@keyframes hurt{30%{box-shadow:inset 0 0 0 6px #e5484d}}
.met{position:absolute;left:0;top:0;padding:6px 14px;border-radius:999px;background:var(--hl);color:var(--ink);font:700 20px 'Noto Sans KR',sans-serif;white-space:nowrap;box-shadow:0 0 0 4px #ff8a3d55;will-change:transform}
.met i{font-style:normal;color:var(--ok)}
.met.cur{background:#fff}
.met.boss{background:var(--bad);color:#fff;font-size:21px;padding:10px 20px;box-shadow:0 0 0 5px #e5484d55}
.met.boss i{color:var(--hl)}
.met em{font-style:normal;margin-left:8px;background:var(--ink);color:#fff;border-radius:999px;padding:0 8px;font-size:15px}
.met.boom{opacity:0;filter:brightness(2);transition:opacity .2s,filter .2s}
.zap{position:absolute;height:4px;border-radius:2px;background:var(--hl);box-shadow:0 0 10px var(--hl);transform-origin:0 50%;pointer-events:none}
.base{position:absolute;left:50%;bottom:8px;transform:translateX(-50%)}
.base .av{width:72px;height:72px}
.banner{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(32px,6vw,56px) 'Black Han Sans',sans-serif;color:#fff;opacity:0;pointer-events:none}
.banner.show{animation:bn 1.6s}
@keyframes bn{0%{opacity:0;transform:scale(.8)}20%,70%{opacity:1;transform:none}100%{opacity:0}}

/* ===== 운석 모드: 전체 화면 방어전 ===== */
body.meteor-mode{overflow:hidden;background:#050916;color:#eef3ff}
body.meteor-mode .top{display:none}
body.meteor-mode main{max-width:none;padding:0;margin:0}
body.meteor-mode main>section{margin:0}
body.meteor-mode .game{position:fixed;inset:0;z-index:20;padding:0;border:0;border-radius:0;background:transparent;pointer-events:none}
body.meteor-mode .game>*{pointer-events:auto}
body.meteor-mode .hud{position:absolute;z-index:8;top:14px;left:18px;right:18px;justify-content:flex-start;gap:clamp(12px,3vw,34px);margin:0;padding:10px 16px;border:1px solid #7184b866;border-radius:14px;background:#0a1226b8;backdrop-filter:blur(8px);color:#fff}
body.meteor-mode .hud span{color:#b8c7e8} body.meteor-mode .hud b{font-size:clamp(23px,4vw,34px);min-width:1ch}
body.meteor-mode .sky{position:absolute;inset:0;height:100%;margin:0;border:0;border-radius:0;overflow:hidden;background:radial-gradient(ellipse at 50% 80%,#253d69 0,transparent 44%),radial-gradient(circle at 18% 17%,#314574 0,transparent 32%),linear-gradient(180deg,#050916 0%,#101d3c 58%,#18294a 100%)}
body.meteor-mode .sky:before{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 32% 9%,#fff 60%,transparent),radial-gradient(2px 2px at 73% 21%,#c8dcff 60%,transparent),radial-gradient(1px 1px at 88% 13%,#fff 60%,transparent),radial-gradient(1px 1px at 56% 33%,#fff 60%,transparent),radial-gradient(2px 2px at 42% 25%,#fff 60%,transparent);background-size:310px 210px;opacity:.9}
body.meteor-mode .sky:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,transparent,#101a31 35%,#0b1326 100%);border-top:1px solid #7c91bb44}
body.meteor-mode .met{z-index:3;isolation:isolate;position:absolute;display:grid;place-items:center;width:104px;height:72px;min-width:0;min-height:0;padding:5px;background:transparent;border:0;border-radius:0;color:#fff1d5;font-size:clamp(13px,1.5vw,17px);line-height:1.2;font-weight:800;text-align:center;overflow:visible;text-shadow:0 2px 4px #24150f,0 0 9px #24150f;filter:drop-shadow(0 5px 5px #0009)}
@keyframes meteorSlowSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
body.meteor-mode .met:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 28% 22%,#e7c49a 0 5%,transparent 17%),radial-gradient(ellipse at 69% 65%,#493b36 0 7%,transparent 19%),radial-gradient(ellipse at 48% 43%,#b58b68 0 8%,transparent 22%),radial-gradient(ellipse at 75% 25%,#d6b18a 0 4%,transparent 15%),linear-gradient(145deg,#92745e 0%,#59483e 38%,#302b2b 72%,#171d29 100%);clip-path:polygon(17% 4%,39% 0,54% 8%,76% 3%,96% 24%,91% 49%,100% 68%,78% 93%,55% 88%,34% 100%,9% 81%,0 55%,8% 29%);border:0;box-shadow:inset -12px -10px 15px #080d19, inset 5px 4px 9px #f0c99a66;animation:meteorSlowSpin 11s linear infinite;transform-origin:50% 50%}
body.meteor-mode .met:after{content:"";position:absolute;z-index:-1;inset:-8px 4px 50%;background:linear-gradient(110deg,transparent 15%,#ffcf8b88 48%,transparent 75%);filter:blur(7px);transform:rotate(-18deg)}
body.meteor-mode .met.boss{width:132px;height:86px;min-width:0;min-height:0;padding:8px;color:#fff4f4;font-size:clamp(15px,1.8vw,20px);text-shadow:0 2px 5px #3a0718,0 0 12px #ff536f}
body.meteor-mode .met.boss:before{background:radial-gradient(ellipse at 27% 25%,#ffb0a0 0 5%,transparent 17%),radial-gradient(ellipse at 68% 65%,#3c172c 0 8%,transparent 20%),radial-gradient(ellipse at 50% 42%,#e15d69 0 8%,transparent 23%),radial-gradient(ellipse at 78% 26%,#ff9a87 0 5%,transparent 15%),linear-gradient(145deg,#c44b59 0%,#7d263f 43%,#421a36 76%,#201b31 100%);border:0;box-shadow:inset -13px -11px 17px #220c25, inset 5px 4px 10px #ffd1b066;animation:meteorSlowSpin 13s linear infinite;clip-path:polygon(16% 3%,37% 0,53% 9%,77% 2%,97% 22%,91% 47%,100% 69%,78% 96%,55% 88%,33% 100%,8% 82%,0 55%,8% 28%)}
body.meteor-mode .met.cur{filter:drop-shadow(0 0 12px #ffe08a) drop-shadow(0 0 5px #fff)} body.meteor-mode .met i{color:#fff2a8}
body.meteor-mode .met::after{display:none!important;content:none!important}
body.meteor-mode .met::before{border:0!important;outline:0!important;box-shadow:inset -12px -10px 15px #080d19,inset 5px 4px 9px #f0c99a66!important}
body.meteor-mode .met{outline:0!important;border:0!important;box-shadow:none!important}
body.meteor-mode .base{z-index:5;left:50%;bottom:clamp(120px,16vh,160px);width:170px;height:145px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center}
.meteor-village{position:absolute;z-index:2;left:0;right:0;bottom:0;height:24%;display:flex;align-items:flex-end;justify-content:space-around;gap:8px;padding:0 4%;opacity:.95}
.meteor-village i{display:block;position:relative;width:clamp(42px,8vw,94px);height:clamp(48px,12vh,105px);background:linear-gradient(135deg,#34466a,#17233d);border:2px solid #65799c;border-bottom:0;border-radius:5px 5px 0 0}
.meteor-village i:before{content:"";position:absolute;left:50%;top:-17px;transform:translateX(-50%);border-left:calc(clamp(42px,8vw,94px)/2) solid transparent;border-right:calc(clamp(42px,8vw,94px)/2) solid transparent;border-bottom:18px solid #536585}
.meteor-village i:after{content:"";position:absolute;inset:24px 10px 8px;background:repeating-linear-gradient(90deg,#f6d88a 0 5px,transparent 5px 17px),repeating-linear-gradient(0deg,transparent 0 13px,#f6d88a 13px 19px,transparent 19px 29px);opacity:.65}
.turret{position:absolute;z-index:4;bottom:5px;left:50%;width:104px;height:44px;transform:translateX(-50%);border:3px solid #17233a;border-radius:28px 28px 12px 12px;background:linear-gradient(#b7c7d9,#61758f);box-shadow:0 5px 0 #0b1326}
.turret:before{content:"";position:absolute;width:58px;height:12px;left:48px;top:-17px;border:3px solid #17233a;border-radius:8px;background:#aebed0;transform:rotate(var(--ang, -90deg));transform-origin:4px 6px;transition:transform 0.1s ease-out}
body.meteor-mode .base .av{position:relative;z-index:5;width:70px;height:70px;margin-bottom:23px;border:3px solid #17233a;box-shadow:0 0 0 4px #d7e6ff55}
body.meteor-mode #in{position:absolute;z-index:9;left:50%;top:auto;bottom:54px;transform:translateX(-50%);width:min(560px,calc(100% - 36px));font-size:clamp(19px,3vw,26px);background:#101b32e8;color:#fff;border:2px solid #91a9d7;box-shadow:0 8px 30px #0008}
body.meteor-mode #in::placeholder{color:#a9b8d5} 
body.meteor-mode .hint{position:absolute;z-index:8;left:50%;top:auto;bottom:24px;transform:translateX(-50%);width:max-content;max-width:90%;text-align:center;color:#c0cce3}
body.meteor-mode .banner{z-index:10;text-shadow:0 4px 18px #000}
@media(max-width:600px){
  body.meteor-mode .hud{top:8px;left:8px;right:8px;padding:7px 9px;gap:12px}
  body.meteor-mode .base{bottom:100px}
  .meteor-village{height:20%}
  body.meteor-mode #in{top:auto;bottom:42px}

}

const LocalStore=(()=>{
  const K='tadak.v1',S='tadak.session',empty=()=>({users:{},scores:[]});
  const load=()=>{try{return JSON.parse(LS.getItem(K))||empty()}catch{return empty()}};
  const save=d=>LS.setItem(K,JSON.stringify(d));
  const hash=async(p,salt)=>{
    if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    let n=5381;for(const c of salt+p)n=(n*33^c.charCodeAt(0))>>>0;return n.toString(16)};
  const cur=d=>d.users[LS.getItem(S)];
  return{
    scope:'이 브라우저에 저장된 기록이에요.',
    async init(){},
    async signup(nick,pw){const d=load(),k=nick.toLowerCase();
      if(d.users[k])throw Error('이미 사용 중인 닉네임이에요.');
      const salt=Math.random().toString(36).slice(2);
      d.users[k]={nick,salt,hash:await hash(pw,salt),color:COLORS[Object.keys(d.users).length%6],at:Date.now(),pts:0,own:[],eq:{...DEF},lang:'ko',avatar:null};
      save(d);LS.setItem(S,k)},
    async login(nick,pw){const d=load(),k=nick.toLowerCase(),u=d.users[k];
      if(!u||u.hash!==await hash(pw,u.salt))throw Error('닉네임이나 비밀번호가 맞지 않아요.');
      LS.setItem(S,k)},
    me(){const d=load(),k=LS.getItem(S);return d.users[k]?{...d.users[k],k}:null},
    logout(){LS.removeItem(S)},
    async deleteAccount(){const d=load(),k=LS.getItem(S);if(!k||!d.users[k])throw Error('로그인이 필요해요.');delete d.users[k];d.scores=d.scores.filter(s=>s.u!==k);save(d);LS.removeItem(S)},
    async redeem(){throw Error('포인트 코드는 서버에서만 쓸 수 있어요.')},
    async patch(o){const d=load(),u=cur(d);if(!u)return;
      if(o.color&&/^#[0-9a-f]{6}$/i.test(o.color))u.color=o.color;
      if('avatar' in o)u.avatar=o.avatar||null;
      if(o.lang==='ko'||o.lang==='en')u.lang=o.lang;save(d)},
    async buyConsumable(id){const d=load(),u=cur(d),it=(ITEMS.active||[]).find(i=>i[0]===id);if(!u||!it)throw Error('없는 아이템이에요.');if((u.pts||0)<it[2])throw Error('포인트가 부족해요.');u.pts-=it[2];u.inv=u.inv||{};u.inv[id]=(u.inv[id]||0)+1;save(d)},
    async useConsumable(id){const d=load(),u=cur(d);if(!u||!(u.inv||{})[id])throw Error('보유한 스킬이 없어요.');u.inv[id]--;if(!u.inv[id])delete u.inv[id];save(d)},
    async equip(slot,id){const d=load(),u=cur(d),it=(ITEMS[slot]||[]).find(i=>i[0]===id);
      if(!u||!it)throw Error('없는 아이템이에요.');
      u.own=u.own||[];u.pts=u.pts||0;let bought=false;
      if(it[2]>0&&!u.own.includes(id)){if(u.pts<it[2])throw Error('포인트가 부족해요.');u.pts-=it[2];u.own.push(id);bought=true}
      u.eq={...DEF,...u.eq,[slot]:id};save(d);return bought},
    async addScore(r){const d=load();d.scores.push(r);if(d.scores.length>3000)d.scores.splice(0,d.scores.length-3000);
      const u=d.users[r.u];if(u)u.pts=(u.pts||0)+r.pts;save(d)},
    async top(mode,lang,n){const d=load(),b={};
      for(const s of d.scores)if(s.mode===mode&&(s.lang||'ko')===lang&&(!b[s.u]||s.score>b[s.u].score))b[s.u]=s;
      return Object.values(b).filter(s=>d.users[s.u]).map(s=>({...s,max:s.max||s.cpm,nick:d.users[s.u].nick,color:d.users[s.u].color,eq:d.users[s.u].eq,avatar:d.users[s.u].avatar})).sort((a,c)=>c.score-a.score).slice(0,n)},
    async mine(k){return load().scores.filter(s=>s.u===k).map(s=>({...s,max:s.max||s.cpm,lang:s.lang||'ko'}))}
  }})();

const SupaStore=(()=>{
  let ME=null;const TK='tadak.token',tok=()=>LS.getItem(TK);
  const rpc=async(fn,a)=>{let r;
    try{r=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(a)})}
    catch{throw Error('서버에 연결하지 못했어요. 인터넷을 확인해 주세요.')}
    const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{}
    if(!r.ok)throw Error(j&&j.message||'문제가 생겼어요. 잠시 뒤에 다시 해 주세요.');return j};
  return{
    scope:'우리 반 모두의 기록이에요.',

function bindDraw(){const c=document.getElementById('dc');if(!c)return;const x=c.getContext('2d');x.lineCap='round';x.lineJoin='round';
  DW={c,x,drawing:false,last:null,stack:[]};
  const pos=ev=>{const r=c.getBoundingClientRect();return[(ev.clientX-r.left)*c.width/r.width,(ev.clientY-r.top)*c.height/r.height]};
  const line=(a,b)=>{x.globalCompositeOperation=DS.erase?'destination-out':'source-over';x.strokeStyle=DS.color;x.lineWidth=DS.size;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
  c.addEventListener('pointerdown',ev=>{ev.preventDefault();c.setPointerCapture(ev.pointerId);DW.stack.push(x.getImageData(0,0,c.width,c.height));if(DW.stack.length>30)DW.stack.shift();DW.drawing=true;DW.last=pos(ev);line(DW.last,DW.last)});
  c.addEventListener('pointermove',ev=>{if(!DW||!DW.drawing)return;const p=pos(ev);line(DW.last,p);DW.last=p});
  const end=()=>{if(DW)DW.drawing=false};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function undoDraw(){if(DW&&DW.stack.length)DW.x.putImageData(DW.stack.pop(),0,0)}
function clearDraw(){if(!DW)return;DW.stack.push(DW.x.getImageData(0,0,DW.c.width,DW.c.height));DW.x.globalCompositeOperation='source-over';DW.x.clearRect(0,0,DW.c.width,DW.c.height)}

const ChatStore = {
  get: () => {
    try { return JSON.parse(localStorage.getItem('tadak.chat')) || []; }
    catch { return []; }
  },
  add: (msg) => {
    const arr = ChatStore.get();
    arr.push(msg);
    if(arr.length > 60) arr.shift();
    localStorage.setItem('tadak.chat', JSON.stringify(arr));
    window.dispatchEvent(new Event('chat_update'));
  }
};

let chatBound = false;
function renderChat() {
  const box = $('#chat-list');
  if(!box) return;
  const chats = ChatStore.get(), me = Store.me();
  box.innerHTML = chats.map(c => `
    <div style="display:flex;gap:10px;align-items:flex-end;${c.u === me.k ? 'flex-direction:row-reverse;' : ''}">
      <div style="flex:none;margin-bottom:4px">${av(c.user, 'xs')}</div>
      <div style="background:${c.u === me.k ? 'var(--acc)' : 'var(--grid)'};color:${c.u === me.k ? '#fff' : 'var(--ink)'};padding:10px 14px;border-radius:14px;font-size:15px;max-width:80%;word-break:break-word;">
        <div style="font-size:12px;font-weight:bold;opacity:0.7;margin-bottom:4px;${c.u === me.k ? 'text-align:right' : ''}">${esc(c.user.nick)}</div>
        ${esc(c.text)}
      </div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function doSendChat() {
  const cin = $('#chat-in');
  if(!cin) return;
  const v = cin.value.trim();
  if(!v) return;
  const u = Store.me();
  ChatStore.add({u: u.k, text: v, user: {nick: u.nick, color: u.color, eq: u.eq, avatar: u.avatar}});
  cin.value = '';
}

function bindChat() {
  if(!chatBound) {
    window.addEventListener('storage', e => { if(e.key === 'tadak.chat') renderChat(); });
    window.addEventListener('chat_update', renderChat);
    chatBound = true;
  }
  const cin = $('#chat-in');
  if(cin) {
    cin.focus();
    cin.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.isComposing) { e.preventDefault(); doSendChat(); }
    });
  }
  renderChat();
}

function startGame(mode){const lang=lg(Store.me());
  G={mode,lang,pool:shuffle(TEXT[lang][mode].slice()),i:0,hit:0,tot:0,max:0,ts:0,t0:0,comp:false};R=null;go('game')}
const cur=()=>G.pool[G.i%G.pool.length];
function paint(){const t=cur(),v=$('#in').value;
  $('#tg').innerHTML=[...t].map((c,i)=>{let k='';
    if(i<v.length)k=v[i]===c?'ok':(i===v.length-1&&G.comp?'cur':'bad');else if(i===v.length)k='cur';
    return`<span class="${k}">${c}</span>`}).join('');
  $('#nx').textContent=G.pool[(G.i+1)%G.pool.length]}
function tick(){if(!G||!G.t0)return;
  const el=(performance.now()-G.t0)/1000,left=Math.max(0,60-el);
  $('#tl').textContent=Math.ceil(left);$('#pb').style.width=left/60*100+'%';
  $('#cp').textContent=el>2?Math.round(G.hit/(el/60)):0;$('#ac').textContent=G.tot?Math.round(G.hit/G.tot*100):100;
  if(left<=0)finish()}
function submit(){const inp=$('#in'),t=cur(),v=inp.value.trim();
  if(!v){inp.value='';return}
  let h=0;const st=strokes(t);for(let i=0;i<t.length;i++)if(v[i]===t[i])h+=strokes(t[i]);
  if(h===st&&G.ts){const d=(performance.now()-G.ts)/1000;if(d>.5)G.max=Math.max(G.max,Math.round(st/d*60))}
  G.hit+=h;G.tot+=st;G.i++;G.ts=0;
  const tg=$('#tg');tg.classList.remove('no');void tg.offsetWidth;if(h<st)tg.classList.add('no');
  inp.blur();inp.value='';inp.focus();paint();tick()}
function bindGame(){const inp=$('#in');inp.focus();paint();
  $('.game').addEventListener('click',()=>inp.focus());
  inp.addEventListener('compositionstart',()=>G&&(G.comp=true));
  inp.addEventListener('compositionend',()=>{if(G){G.comp=false;paint()}});
  inp.addEventListener('input',()=>{if(!G)return;
    if(!G.t0){G.t0=performance.now();timer=setInterval(tick,100)}
    if(!G.ts&&inp.value)G.ts=performance.now();
    paint()});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&G){e.preventDefault();submit()}})}
async function finish(){clearInterval(timer);const g=G;G=null;
  const acc=g.tot?Math.round(g.hit/g.tot*100):0,score=Math.round(g.hit*acc/100);
  await saveResult({mode:g.mode,lang:g.lang,cpm:g.hit,max:Math.max(g.max,g.hit),acc,score,pts:score>0?g.hit:0})}
async function persist(){const u=Store.me(),o=R;
  try{o.err='';if(o.score>0||o.pts>0){const prev=await Store.mine(u.k);
    o.pb=o.score>Math.max(0,...prev.filter(s=>s.mode===o.mode&&s.lang===o.lang).map(s=>s.score));
    await Store.addScore({u:u.k,mode:o.mode,lang:o.lang,cpm:o.cpm,max:o.max,acc:o.acc,score:o.score,pts:o.pts,at:Date.now()});
    o.saved=true;o.rank=(await Store.top(o.mode,o.lang,1000)).findIndex(s=>s.u===u.k)+1}}
  catch(x){o.err=x.message||'알 수 없는 오류'}}

function loop(ts){if(!M)return;const dt=Math.min(.05,(ts-(M.last||ts))/1000);M.last=ts;

  TD.loadout=[0,1,2].map(i=>{const k=document.querySelector(`[data-sl="${i}"]`).value;if(!k||used[k]||!((inv[k]||0)>0))return null;used[k]=1;return k});
  TD.prep=false;$('#tdPrep')?.remove();tdRenderSkills();tdSay('출전! 낱말을 쳐서 골드를 벌어요');$('#tdi')?.focus()}
function tdRenderSkills(){if(!TD)return;[0,1,2].forEach(i=>{const b=$('#tdsk'+i);if(!b)return;const id=TD.loadout?TD.loadout[i]:null;
  b.className='td-sk'+(id?'':' empty')+(TD.armed===i?' armed':'');b.disabled=!id;
  b.title=id?`${TD_SK[id].desc} · "${TD_SK[id].keyword}"을 쳐서 발동`:'';
  b.innerHTML=id?`${SK_ICON[id]}<small>${TD_SK[id].name}</small>`:'<small>빈 슬롯</small>'})}
function tdUseSkill(i,typed){if(!TD||TD.prep||TD.shopOpen)return;const id=TD.loadout[i];if(!id)return;
  if(!typed){TD.armed=TD.armed===i?null:i;tdRenderSkills();tdHud();if(TD.armed!=null)tdSay(`${TD_SK[id].name} 준비! "${TD_SK[id].keyword}"을 쳐서 발동하세요`);$('#tdi')?.focus();return}
  TD.loadout[i]=null;TD.armed=null;Store.useConsumable(id).catch(()=>{});
  if(id==='ac_ice'){TD.enemies.forEach(e=>{if(!e.dead&&!e.leak)e.frozen=4+TD.up.skill});tdSay('얼음! 적 전체가 4초 동안 멈췄어요')}
  else if(id==='ac_thunder'){TD.enemies.forEach(e=>{if(e.dead||e.leak)return;tdHit(e,e.boss?e.max*.1:e.max*(.3+.1*TD.up.skill));tdRing(e.x,'#ffd84d')});tdSay('번개! 적들이 큰 피해를 입었어요')}
  else if(id==='ac_heal'){TD.life+=2;tdSay('기지 회복 +2')}
  tdRenderSkills();tdHud()}
function tdAct(a,v){if(!TD)return;const sel=TD.sel;
  if(a==='td-go')return tdGo();if(a==='td-skill')return tdUseSkill(+v);
  if(a==='td-aug')return tdBuyAugment(v);
  if(a==='td-reroll')return tdRerollAugment();
  if(a==='td-slot'){const i=+v;TD.sel=sel&&sel.i===i?null:{i}}
  else if(a==='td-close')TD.sel=null;
  else if(a==='td-buy'&&sel){const s=TD_T[v],i=sel.i,cost=Math.round(s.cost*(TD.up?TD.up.discount:1));if(!TD.towers[i]&&TD.wave>=s.unlock&&TD.gold>=cost){TD.gold-=cost;TD.towers[i]={type:v,lvl:1,spent:cost,cd:0};TD.sel=null}}
  else if(a==='td-up'&&sel){const t=TD.towers[sel.i];if(t&&t.lvl<5){const c=tdUpCost(t);if(TD.gold>=c){TD.gold-=c;t.spent+=c;t.lvl++}}}
  else if(a==='td-sell'&&sel){const t=TD.towers[sel.i];if(t){TD.gold+=tdRefund(t);TD.towers[sel.i]=null;TD.sel=null}}
  else if(a==='td-next'){if(TD.phase==='break')TD.breakT=0}
  else if(a==='td-quit'){tdEnd();return}
  TD.towers.forEach((_,i)=>tdRenderSlot(i));tdRenderPanel();tdHud();
  setTimeout(()=>{const i=$('#tdi');if(i)i.focus()},0)}
async function tdEnd(){if(!TD||TD.ended)return;TD.ended=true;cancelAnimationFrame(tdRaf);const g=TD;TD=null;
  const mins=Math.max(.05,(performance.now()-g.t0)/60000),cpm=Math.round(g.hit/mins),acc=g.ok+g.bad?Math.round(g.ok/(g.ok+g.bad)*100):0,
    score=g.kills*10+Math.max(0,g.reached-1)*100;
  await saveResult({mode:'td',lang:g.lang,cpm,max:cpm,acc,score,pts:Math.floor(g.gold/3),wave:g.reached})}

let AVIO=null;
function watchAvatars(){if(AVIO)AVIO.disconnect();
  AVIO=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('off',!e.isIntersecting)),{rootMargin:'120px'});
  document.querySelectorAll('.rig-svg').forEach(el=>AVIO.observe(el))}
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('bg',document.hidden));
async function route(){clearInterval(timer);cancelAnimationFrame(raf);const h=(location.hash||'#home').slice(1),app=$('#app');document.body.classList.toggle('meteor-mode',h==='meteor');document.body.classList.toggle('td-mode',h==='td');if(h!=='td'&&TD){TD=null;cancelAnimationFrame(tdRaf)}
  if(!Store.me()){app.innerHTML=vAuth();return}
  if((h==='game'&&!G)||(h==='meteor'&&!M)||(h==='result'&&!R)||(h==='td'&&!TD)){go('home');return}
  if(h!=='game')G=null;if(h!=='meteor')M=null;
  try{app.innerHTML=await({home:vHome,rank:vRank,shop:vShop,profile:vProfile,draw:vDraw,game:vGame,meteor:vMeteor,result:vResult,plaza:vPlaza,td:vTD}[h]||vHome)()}
  catch(x){app.innerHTML=layout(`<section class="card"><h3>불러오지 못했어요</h3><p class="mute">${esc(x.message)}</p><p style="margin-top:12px"><button class="btn" data-a="retry">다시 시도</button></p></section>`,'')}
  if(h==='game')bindGame();if(h==='meteor')bindMeteor();if(h==='plaza')bindChat();if(h==='draw')bindDraw();if(h==='td')bindTD();watchAvatars();window.scrollTo(0,0)}
addEventListener('hashchange',route);
async function doAuth(){if(busy)return;
  const q=k=>{const i=document.querySelector('#af [name='+k+']');return i?i.value:''},n=q('n').trim(),p=q('p');
  try{
    if(!/^[가-힣a-zA-Z0-9_]{2,8}$/.test(n))throw Error('닉네임은 한글, 영문, 숫자로 2~8자예요.');
    if(authMode==='signup'){
      if(p.length<4)throw Error('비밀번호는 4자 이상으로 해 주세요.');
      if(p!==q('p2'))throw Error('비밀번호가 서로 달라요.');
      busy=true;await Store.signup(n,p)}else{busy=true;await Store.login(n,p)}
    busy=false;go('home')}catch(x){busy=false;$('#er').textContent=x.message||'문제가 생겼어요. 다시 해 주세요.'}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.closest&&e.target.closest('#af'))doAuth();if(e.key==='Enter'&&e.target.id==='hc'){e.preventDefault();document.querySelector('[data-a=code]').click()}});
const act=async f=>{try{await f()}catch(x){note=x.message}route()};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,u=Store.me();
  if(a==='go')doAuth();
  else if(a==='play')v==='meteor'?startMeteor():v==='td'?startTD():startGame(v);
  else if(a.startsWith('td-'))tdAct(a,v);
  else if(a==='auth'){authMode=v;route()}
  else if(a==='rm'){rankMode=v;route()}
  else if(a==='rl'){rankLang=v;route()}
  else if(a==='color')act(()=>Store.patch({color:v}));
  else if(a==='slot'){shopSlot=v;route()}
  else if(a==='item')act(async()=>{note=(await Store.equip(shopSlot,v))?'구매했어요.':''});
  else if(a==='buyact')act(async()=>{await Store.buyConsumable(v);note='구매했어요.'});
  else if(a==='uslot'){uShopSlot=v;route()}
  else if(a==='uitem')act(async()=>{note=(await Store.equip(uShopSlot,v))?'구매했어요.':''});
  else if(a==='upgrade')buyUpgrade(v);
  else if(a==='upgrade-skip')closeUpgradeShop();
  else if(a==='lang')act(()=>Store.patch({lang:lg(u)==='ko'?'en':'ko'}));
  else if(a==='pick')$('#pf').click();
  else if(a==='unpic')act(()=>Store.patch({avatar:null}));
  else if(a==='buy')act(async()=>{const ok=await Store.equip(t.dataset.s,v);note=ok?'구매했어요.':''});
  else if(a==='draw')go('draw');
  else if(a==='go-profile')go('profile');
  else if(a==='dtool'){const k=t.dataset.k;
    if(k==='color'){DS.color=t.dataset.v;DS.erase=false}else if(k==='size'){DS.size=+t.dataset.v;DS.erase=false}else if(k==='erase'){DS.erase=!DS.erase}
    document.querySelectorAll('[data-grp]').forEach(b=>{const g=b.dataset.grp;
      b.classList.toggle('on',g==='erase'?DS.erase:g==='color'?(!DS.erase&&b.dataset.v===DS.color):(!DS.erase&&+b.dataset.v===DS.size))})}
  else if(a==='dundo')undoDraw();
  else if(a==='dclear')clearDraw();
  else if(a==='dsave')act(saveDraw);
  else if(a==='del'){if(confirm('정말 계정을 삭제할까요? 기록과 포인트가 모두 지워지고 되돌릴 수 없어요.'))act(async()=>{await Store.deleteAccount();R=null;G=null;M=null;authMode='login';go('home')})}
  else if(a==='code'){const i=document.getElementById('hc'),c=(i&&i.value||'').trim();if(i)i.value='';if(!c)return;act(async()=>{await Store.redeem(c);note='포인트를 받았어요.'})}
  else if(a==='attend')act(async()=>{await Store.attend();note='출석 보상을 받았어요!'});
  else if(a==='game-quit'){if(G)finish();else if(M)endMeteor()}
  else if(a==='retry')route();
  else if(a==='resave'){await persist();route()}
  else if(a==='sendChat')doSendChat();
  else if(a==='out'){Store.logout();R=null;G=null;M=null;authMode='login';go('home')}});
document.addEventListener('change',e=>{
  if(e.target.id==='cc')act(()=>Store.patch({color:e.target.value}));
  if(e.target.id==='pf'&&e.target.files[0]){const f=e.target.files[0];act(async()=>{const own=Store.me().own||[];
    if(!own.includes('ph_photo'))throw Error('사진 올리기는 300포인트로 먼저 열어 주세요.');
    if(f.type==='image/gif'&&!own.includes('ph_gif'))throw Error('움짤(GIF)은 500포인트로 먼저 열어 주세요.');
    await Store.patch({avatar:await toAvatar(f)})})}});
function showNoticeBox(text,block){const d=document.createElement('div');d.id='tdNotice';
  d.style.cssText='position:fixed;inset:0;z-index:999;background:#0b1326dd;display:grid;place-items:center;padding:16px';
  d.innerHTML=`<div class="card" style="max-width:460px;width:100%;background:#fff"><h3>${block?'새 버전 업데이트가 필요해요':'공지'}</h3><p class="notice-body" style="white-space:pre-line;margin:10px 0"></p><p><button class="btn pri" id="ntBtn">${block?'업데이트 받기':'확인'}</button></p></div>`;
  d.querySelector('.notice-body').textContent=text;
  document.body.appendChild(d);
  d.querySelector('#ntBtn').onclick=block?()=>{location.href=location.pathname+'?v='+Date.now()}:()=>d.remove()}
function inGame(){return /^#(td|game|meteor)$/.test(location.hash)}
async function checkVersion(){let info=null;try{info=await Store.notice()}catch{return}
  if(!info||!info.version||info.version===APP_VERSION)return info;
  if(inGame())return null;
  if(window.sessionStorage.getItem('taja.reloaded')!==info.version){
    window.sessionStorage.setItem('taja.reloaded',info.version);
    location.replace(location.pathname+'?v='+encodeURIComponent(info.version));return null}
  if(!document.getElementById('tdNotice'))showNoticeBox((info.notice||'새 버전이 나왔어요.')+`\n\n현재 버전 ${APP_VERSION} / 서버 최신 버전 ${info.version}\n업데이트를 받은 뒤에 이용할 수 있어요.`,true);
  return null}
async function bootApp(){const info=await checkVersion();
  if(info===null&&document.getElementById('tdNotice'))return;
  Store.init().then(route,route);
  if(info&&info.notice&&window.localStorage.getItem('taja.notice')!==info.version){window.localStorage.setItem('taja.notice',info.version);showNoticeBox(info.notice,false)}
  setInterval(()=>{if(!document.getElementById('tdNotice'))checkVersion()},120000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()});
  window.addEventListener('hashchange',()=>{if(!inGame())checkVersion()})}
if(!SB.url||!SB.key){document.getElementById('app').innerHTML='<section class="card" style="margin-top:40px"><h3>서버 설정이 필요해요</h3><p class="mute">SB 설정에 Supabase 주소와 anon 키를 넣어 주세요.</p></section>'}else bootApp();
</script>
